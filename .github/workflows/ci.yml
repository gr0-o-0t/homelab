name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["**"]

# Keep this in lockstep with the local toolchain: `make lint-full` runs whatever
# golangci-lint is on PATH, so a drifting version means CI and a developer's
# machine disagree about what passes.
env:
  GOLANGCI_LINT_VERSION: v2.12.2

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}

      # One command, the same one developers run. This used to inline `go vet`,
      # `go test -race` and `go build`, which quietly dropped the golangci-lint
      # step that `make ci` also runs — a batch of gosec and gocritic findings,
      # including a command injection on the restore path, sat in the tree with
      # CI green.
      - name: make ci
        run: make ci
