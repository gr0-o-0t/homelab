name: Release

on:
  push:
    tags:
      - "v*.*.*"

# Creating a release and uploading assets is a write. Repositories default the
# GITHUB_TOKEN to read-only, so without this the build succeeds and the upload
# step fails at the very end.
permissions:
  contents: write
  # Pushing the agent image to ghcr.io with the GITHUB_TOKEN.
  packages: write

# Must equal bootstrap.ImageRepo: `homelab init|join|upgrade` pull
# <IMAGE>:<version> by default. GHCR names are lowercase.
env:
  IMAGE: ghcr.io/gr0-o-0t/homelab

jobs:
  release:
    # The GUI build links the runner's glibc, so the runner sets the oldest
    # desktop it starts on: ubuntu-latest's 2.43 broke Linux Mint 22 (2.39).
    # It cannot go below 24.04 either: cimgui-go's prebuilt cimgui.a needs
    # glibc >= 2.38 (__isoc23_sscanf) and fails to link on 22.04's 2.35.
    # The glibc check after `make release` holds the floor.
    runs-on: ubuntu-24.04
    steps:
      # fetch-depth: 0 is load-bearing — the Makefile derives VERSION from
      # `git tag --points-at HEAD`, which sees nothing in a shallow clone.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # The default build includes the desktop GUI (giu), which needs cgo and
      # the OpenGL/X11 development headers (cached .debs, as in ci.yml).
      - uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libgl1-mesa-dev xorg-dev
          version: "1.0"

      # amd64 with the GUI, amd64 headless and arm64 headless, each packed as
      # dist/homelab_<tag>_linux_<arch>.tar.gz, plus dist/SHA256SUMS.
      - name: Build and package
        run: make release

      # The GUI binary must run on glibc 2.39 (Ubuntu 24.04, Linux Mint 22,
      # Debian 13 and anything newer): fail here rather than ship one that
      # will not start.
      - name: Check the GUI build's glibc floor
        run: |
          need=$(objdump -T dist/homelab_*_linux_amd64/homelab | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -1)
          echo "the GUI build needs glibc $need"
          test "$(printf '%s\n' "$need" 2.39 | sort -V | tail -1)" = 2.39

      # The agent image, linux/amd64 + linux/arm64, from the static headless
      # binaries `make release` just built (dist/image/linux_<arch>/homelab):
      # nothing is compiled again inside Docker. QEMU only runs the image's
      # `apk add tzdata` for arm64.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # :latest only for a final release: a prerelease tag (v1.2.0-rc1, any
      # "-") gets its own tag and nothing else.
      - name: Image tags
        id: tags
        run: |
          tags="${IMAGE}:${GITHUB_REF_NAME}"
          case "${GITHUB_REF_NAME}" in
            *-*) ;;
            *) tags="${tags},${IMAGE}:latest" ;;
          esac
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
      - name: Build and push the agent image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.ref_name }}
          # Layer cache in the GitHub Actions cache: the base image and the
          # tzdata layer are reused between releases.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: true
          tags: ${{ steps.tags.outputs.tags }}

      # Release notes are the CHANGELOG.md section for this tag, followed by
      # install instructions. A tag without a section fails here rather than
      # publishing an empty release.
      - name: Release notes
        run: |
          awk -v tag="${GITHUB_REF_NAME}" '
            /^## / { if (found) exit; if (index($0, "## " tag " ") == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for ${GITHUB_REF_NAME}"; exit 1; }
          cat >> notes.md <<'NOTES'

          ### Install

          ```bash
          VERSION=${{ github.ref_name }}
          # Desktop amd64 (includes `homelab --gui`; needs glibc, libGL and X11 at runtime).
          # Servers: ARCH=amd64_headless. Raspberry Pi / ARM64 (headless): ARCH=arm64.
          # The headless builds are static binaries: any distro, Alpine/musl included.
          ARCH=amd64
          NAME=homelab_${VERSION}_linux_${ARCH}
          BASE=https://github.com/${{ github.repository }}/releases/download/$VERSION
          wget "$BASE/$NAME.tar.gz" "$BASE/SHA256SUMS"
          sha256sum --check --ignore-missing SHA256SUMS
          tar xzf "$NAME.tar.gz"
          sudo install -m 0755 "$NAME/homelab" /usr/local/bin/homelab
          ```

          On the first PC (the Swarm manager), create the cluster; it prints the join command:

          ```bash
          homelab init
          ```

          On every other PC, join it; or, on a PC that should only run the CLI, log in:

          ```bash
          homelab join     # or: homelab login
          ```

          To move an existing cluster to this version, install this CLI on a PC and run
          `homelab upgrade`: it rolls the agent image `ghcr.io/gr0-o-0t/homelab:${{ github.ref_name }}`
          across the workers, then the leader.
          NOTES

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: "homelab ${{ github.ref_name }}"
          body_path: notes.md
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          draft: false
          # A tag with a "-" (v0.5.0-rc.1) is a prerelease, matching the
          # image step that skips :latest for it.
          prerelease: ${{ contains(github.ref_name, '-') }}
