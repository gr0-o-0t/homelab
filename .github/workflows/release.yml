name: Release

on:
  push:
    tags:
      - "v*.*.*"

# Creating a release and uploading assets is a write. Repositories default the
# GITHUB_TOKEN to read-only, so without this the build succeeds and the upload
# step fails at the very end.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is load-bearing — the Makefile derives VERSION from
      # `git tag --points-at HEAD`, which sees nothing in a shallow clone.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # The default build includes the desktop GUI (giu), which needs cgo and
      # the OpenGL/X11 development headers.
      - name: Install GUI build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1-mesa-dev xorg-dev

      # amd64 with the GUI, amd64 headless and arm64 headless, each packed as
      # dist/homelab_<tag>_linux_<arch>.tar.gz, plus dist/SHA256SUMS.
      - name: Build and package
        run: make release

      # Release notes are the CHANGELOG.md section for this tag, followed by
      # install instructions. A tag without a section fails here rather than
      # publishing an empty release.
      - name: Release notes
        run: |
          awk -v tag="${GITHUB_REF_NAME}" '
            /^## / { if (found) exit; if (index($0, "## " tag) == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for ${GITHUB_REF_NAME}"; exit 1; }
          cat >> notes.md <<'NOTES'

          ### Install

          ```bash
          VERSION=${{ github.ref_name }}
          # Desktop amd64 (includes `homelab --gui`; needs libGL and X11 at runtime).
          # Servers: ARCH=amd64_headless. Raspberry Pi / ARM64 (headless): ARCH=arm64.
          ARCH=amd64
          NAME=homelab_${VERSION}_linux_${ARCH}
          BASE=https://github.com/${{ github.repository }}/releases/download/$VERSION
          wget "$BASE/$NAME.tar.gz" "$BASE/SHA256SUMS"
          sha256sum --check --ignore-missing SHA256SUMS
          tar xzf "$NAME.tar.gz"
          sudo install -m 0755 "$NAME/homelab" /usr/local/bin/homelab
          ```

          Then run `homelab setup` to configure, or `homelab update` to refresh an existing core.
          NOTES

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: "homelab ${{ github.ref_name }}"
          body_path: notes.md
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          draft: false
          prerelease: false
