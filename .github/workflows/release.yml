name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Linux amd64
        run: make build-linux-amd64

      - name: Build Linux arm64
        run: make build-linux-arm64

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: "homelab ${{ github.ref_name }}"
          body: |
            ## Release ${{ github.ref_name }}

            See the [CHANGELOG](../CHANGELOG.md) for what's new.

            ### Downloads

            - [homelab_${{ github.ref_name }}_linux_amd64](homelab_${{ github.ref_name }}_linux_amd64) — x86_64
            - [homelab_${{ github.ref_name }}_linux_arm64](homelab_${{ github.ref_name }}_linux_arm64) — ARM64 (Raspberry Pi, etc.)

            ### Install

            ```bash
            # Download and install
            wget https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/homelab_${{ github.ref_name }}_linux_amd64
            chmod +x homelab_${{ github.ref_name }}_linux_amd64
            sudo mv homelab_${{ github.ref_name }}_linux_amd64 /usr/local/bin/homelab
            ```

            Then run `homelab setup` to configure.
          files: |
            homelab_*
          draft: false
          prerelease: false
