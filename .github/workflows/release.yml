name: Release

on:
  push:
    tags:
      - "v*.*.*"

# Creating a release and uploading assets is a write. Repositories default the
# GITHUB_TOKEN to read-only, so without this the build succeeds and the upload
# step fails at the very end.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is load-bearing — the Makefile derives VERSION from
      # `git tag --points-at HEAD`, which sees nothing in a shallow clone.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Linux amd64
        run: make build-linux-amd64

      - name: Build Linux arm64
        run: make build-linux-arm64

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: "homelab ${{ github.ref_name }}"
          generate_release_notes: true
          body: |
            ### Install

            ```bash
            VERSION=${{ github.ref_name }}
            wget https://github.com/${{ github.repository }}/releases/download/$VERSION/homelab_${VERSION}_linux_amd64
            chmod +x homelab_${VERSION}_linux_amd64
            sudo mv homelab_${VERSION}_linux_amd64 /usr/local/bin/homelab
            ```

            Swap `amd64` for `arm64` on a Raspberry Pi or other ARM64 host.

            Then run `homelab setup` to configure.
          files: |
            homelab_*
          draft: false
          prerelease: false
