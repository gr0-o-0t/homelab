// Yggdrasil node config. Parsed as HJSON, so comments are allowed.
// Reference: https://yggdrasil-network.github.io/configurationref.html
{
    // A node with no peers is isolated — it gets an address and reaches
    // nothing. These are public peers; add closer or more of them from
    // https://github.com/yggdrasil-network/public-peers
    // (?key=... pins the peer's public key, so prefer entries that have one.)
    "Peers": [
        "tls://ins.8px.sk:4321",
        "tls://asia.deinfra.org:15015",
        "tls://ygg1.mk16.de:1338?key=0000000087ee9949eeab56bd430ee8f324cad55abf3993ed9b9be63ce693e18a"
    ],

    // The node's IPv6 address is derived from this key. Without it yggdrasil
    // generates a random one at startup, so the mesh address changes on every
    // restart. It lives on a named volume and is created on first run by
    // entrypoint.ygg.sh, because this file is mounted read-only.
    "PrivateKeyPath": "/var/lib/yggdrasil/private.key",

    // No "Listen": we peer outbound only. Accepting inbound peerings would
    // need a published port, which a NAT'd homelab can rarely offer anyway.

    // LAN peer discovery. Behind the Docker bridge this only ever sees other
    // containers, but it costs nothing and works if the node is later moved
    // to host networking.
    "MulticastInterfaces": [
        { "Regex": ".*", "Beacon": true, "Listen": true, "Port": 0 }
    ],

    "AdminListen": "tcp://127.0.0.1:9001",
    "NodeInfoPrivacy": true
}
