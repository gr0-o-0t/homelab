# Caddy routes for Filestash — the body of a site block, no site address.
#
# `homelab enable filestash [--cf|...]` wraps this in whichever site address
# each layer needs. Filestash serves everything on :8334 except the Collabora
# office editor, which the browser loads from the same host
# (OFFICE_REWRITE_URL), so its paths go to the filestash-wopi container.
# Caddy proxies the /cool websocket natively.
@office path /browser/* /hosting/discovery /hosting/capabilities /cool/* /lool/*
handle @office {
	reverse_proxy filestash-wopi:9980
}

handle {
	reverse_proxy filestash:8334
}
