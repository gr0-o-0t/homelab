# ─────────────────────────────────────────────────────────────────────────────
# Caddy config: open-webui (public / Cloudflare Tunnel)
#
# Same upstream as the private variant. Streamed LLM responses need
# flush_interval -1 so tokens reach the client without buffering delays.
# ─────────────────────────────────────────────────────────────────────────────

open-webui.{$PUB_SUBDOMAIN}.{$DOMAIN} {
    import wildcard_tls

    reverse_proxy open-webui:8080 {
        flush_interval -1
        header_up X-Forwarded-Proto https
    }
}
