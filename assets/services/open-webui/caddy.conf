# ─────────────────────────────────────────────────────────────────────────────
# Caddy config: open-webui (private / tailnet)
#
# Open WebUI responds to X-Forwarded-For / X-Forwarded-Proto for Caddy to set
# correctly, hence the trusted_proxies directive. Streamed LLM responses need
# flush_interval -1 so tokens reach the client without buffering delays.
# ─────────────────────────────────────────────────────────────────────────────

open-webui.{$HOME_SUBDOMAIN}.{$DOMAIN} {
    import wildcard_tls

    # Tell Open WebUI the original protocol (https) so it generates correct
    # CSP / redirect URIs.
    reverse_proxy open-webui:8080 {
        flush_interval -1
        header_up X-Forwarded-Proto https
    }
}
