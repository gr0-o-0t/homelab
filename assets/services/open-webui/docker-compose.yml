# ─────────────────────────────────────────────────────────────────────────────
# Service: Open WebUI (browser-based UI for Ollama and other LLM backends)
# https://docs.openwebui.com
#
# Note: The ollama service must be running on the home-services network for
# open-webui to reach it via Docker DNS (http://ollama:11434).
# ─────────────────────────────────────────────────────────────────────────────

networks:
  # Shared network — Caddy (via Tailscale namespace) reaches every service here
  home-services:
    name: home-services
    external: true

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    user: "${PUID:-1000}:${PGID:-1000}"
    restart: always
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
      WEBUI_URL: https://open-webui.${HOME_SUBDOMAIN}.${DOMAIN}
    volumes:
      - open-webui-data:/app/backend/data
    networks:
      - home-services
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://localhost:8080 2>/dev/null || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  open-webui-data:
    name: open-webui_data
