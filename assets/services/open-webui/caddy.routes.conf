# Route body for Open WebUI — directives only, no site address and no TLS
# import. `homelab enable` wraps this in whichever site address each layer
# needs, so the routes are defined once instead of once per layer.
#
# Open WebUI reads X-Forwarded-Proto to generate correct CSP / redirect URIs.
# Streamed LLM responses need flush_interval -1 so tokens reach the client
# without buffering delays.

reverse_proxy open-webui:8080 {
    flush_interval -1
    header_up X-Forwarded-Proto https
}
