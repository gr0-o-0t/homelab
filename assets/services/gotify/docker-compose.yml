# ─────────────────────────────────────────────────────────────────────────────
# Service: Gotify (self-hosted push notification server)
# https://gotify.net/docs/
# ─────────────────────────────────────────────────────────────────────────────

networks:
  home-services:
    name: home-services
    external: true

services:
  gotify:
    image: gotify/server:latest
    container_name: gotify
    # No `user:` — /app/data doesn't exist in the image, so the fresh volume is
    # root-owned and a non-root process can't create the database.
    restart: always
    environment:
      TZ: ${TZ:-UTC}
      # Only applied when the database is first created.
      GOTIFY_DEFAULTUSER_PASS: ${GOTIFY_ADMIN_PASSWORD}
    volumes:
      - gotify-data:/app/data
    networks:
      - home-services
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost/health >/dev/null || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  gotify-data:
    name: gotify_data
