vars:
  BIFROST_LOG_LEVEL:
    value: "info"
    required: false
    description: "Log level: debug, info, warn, error"

secrets:
  BIFROST_SETUP_TOKEN:
    required: true
    description: "One-time token Bifrost asks for when creating the first admin account (pick any long random string)"

databases:
  - postgres:
      database: bifrost
      user: bifrost
      env:
        host: BIFROST_PG_HOST
        port: BIFROST_PG_PORT
        user: BIFROST_PG_USER
        password: BIFROST_PG_PASSWORD
        database: BIFROST_PG_DB

ports:
  - 8080
