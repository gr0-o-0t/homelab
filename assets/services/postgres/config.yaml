vars:
  POSTGRES_IMAGE:
    value: "ghcr.io/tensorchord/vchord-postgres:pg18-v1.1.1"
    required: false
    description: "Postgres image — must ship pgvector + VectorChord for immich/appflowy"

secrets:
  POSTGRES_ROOT_PASSWORD:
    required: true
    description: "Password for the postgres superuser"
