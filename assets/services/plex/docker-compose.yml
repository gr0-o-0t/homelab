# ─────────────────────────────────────────────────────────────────────────────
# Service: Plex Media Server
# https://hub.docker.com/r/linuxserver/plex
#
# PLEX_CLAIM: one-time token from https://plex.tv/claim — only needed on first
# run to link the server to your Plex account. Leave blank after initial setup.
#
# Bridge networking, not the `network_mode: host` LinuxServer recommends: host
# mode would publish 32400 and the GDM/DLNA ports on every host interface,
# bypassing ufw. The cost is no LAN auto-discovery (GDM) and Plex treating the
# Caddy hop as a remote client; reach it via https://plex.<home>.<domain> and
# set Settings > Network > "Custom server access URLs" to that address.
# ─────────────────────────────────────────────────────────────────────────────

networks:
  home-services:
    name: home-services
    external: true

services:
  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    # No `user:`: LinuxServer images boot s6 as root, chown /config, then drop
    # to PUID/PGID. Forcing a uid breaks init and leaves /config unwritable.
    restart: always
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
      VERSION: docker
      PLEX_CLAIM: ${PLEX_CLAIM:-}
    volumes:
      - plex-config:/config
      - ${MEDIA_PATH:-/mnt/media}:/media:ro
    networks:
      - home-services
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS -o /dev/null http://localhost:32400/identity || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  plex-config:
    name: plex_config
