vars:
  MATTERMOST_VERSION:
    value: "latest"
    required: false
    description: "Mattermost image tag. Pin a version to control upgrade timing; schema migrations are one-way"
  TZ:
    value: "UTC"
    required: false

secrets: {}

databases:
  - postgres:
      database: mattermost
      user: mattermost
      dsn_template: "postgres://{user}:{password}@{host}:{port}/{database}?sslmode=disable&connect_timeout=10"
      env:
        dsn: MM_DATASOURCE
ports:
  - 8065