# ─────────────────────────────────────────────────────────────────────────────
# Service: Mattermost (self-hosted team messaging platform)
# https://docs.mattermost.com/install/install-docker.html
# ─────────────────────────────────────────────────────────────────────────────
# Database: uses shared PostgreSQL (homelab-postgres). DATABASE_URL is
# auto-generated at `homelab service setup mattermost` and injected at runtime.
# ─────────────────────────────────────────────────────────────────────────────

networks:
  home-services:
    name: home-services
    external: true

services:
  mattermost:
    image: mattermost/mattermost-team-edition:latest
    container_name: mattermost
    user: "${PUID:-1000}:${PGID:-1000}"
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    environment:
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: ${MM_DATASOURCE}
      MM_SERVICESETTINGS_SITEURL: https://mattermost.${HOME_SUBDOMAIN}.${DOMAIN}
      TZ: ${TZ:-UTC}
    volumes:
      - mattermost-config:/mattermost/config
      - mattermost-data:/mattermost/data
      - mattermost-logs:/mattermost/logs
      - mattermost-plugins:/mattermost/plugins
    networks:
      - home-services
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://localhost:8065 2>/dev/null || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  mattermost-config:
    name: mattermost_config
  mattermost-data:
    name: mattermost_data
  mattermost-logs:
    name: mattermost_logs
  mattermost-plugins:
    name: mattermost_plugins
