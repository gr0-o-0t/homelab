# ─────────────────────────────────────────────────────────────────────────────
# Service: Mattermost (self-hosted team messaging platform)
# https://docs.mattermost.com/install/install-docker.html
# ─────────────────────────────────────────────────────────────────────────────
# Database: uses shared PostgreSQL (homelab-postgres). MM_DATASOURCE is
# auto-generated at `homelab setup mattermost` and injected at runtime.
#
# No `user:` — the image already runs as its own non-root `mattermost` user
# (uid 2000), and /mattermost/* ships owned by 2000:2000, so the named volumes
# inherit that. Forcing uid 1000 leaves config/data/logs/plugins unwritable.
# ─────────────────────────────────────────────────────────────────────────────

networks:
  home-services:
    name: home-services
    external: true

services:
  mattermost:
    image: mattermost/mattermost-team-edition:${MATTERMOST_VERSION:-latest}
    container_name: mattermost
    restart: always
    security_opt:
      - "no-new-privileges:true"
    environment:
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: ${MM_DATASOURCE}
      MM_SERVICESETTINGS_SITEURL: https://mattermost.${HOME_SUBDOMAIN}.${DOMAIN}
      TZ: ${TZ:-UTC}
    volumes:
      - mattermost-config:/mattermost/config
      - mattermost-data:/mattermost/data
      - mattermost-logs:/mattermost/logs
      - mattermost-plugins:/mattermost/plugins
    networks:
      - home-services
    # The image ships neither wget nor curl; its own HEALTHCHECK
    # (`mmctl system status --local`) applies when compose is silent.

volumes:
  mattermost-config:
    name: mattermost_config
  mattermost-data:
    name: mattermost_data
  mattermost-logs:
    name: mattermost_logs
  mattermost-plugins:
    name: mattermost_plugins
