# ─────────────────────────────────────────────────────────────────────────────
# Service: dbx (lightweight, cross-platform database client — MySQL,
# PostgreSQL, SQLite, Redis, MongoDB, DuckDB, ClickHouse, SQL Server and more)
# https://github.com/t8y2/dbx
# ─────────────────────────────────────────────────────────────────────────────

networks:
  home-services:
    name: home-services
    external: true

services:
  dbx:
    image: t8y2/dbx
    container_name: dbx
    restart: always
    volumes:
      - dbx-data:/app/data
    networks:
      - home-services
    healthcheck:
      # ponytail: image ships no wget/curl — bash /dev/tcp is the only probe available
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/4224"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  dbx-data:
    name: dbx_data
