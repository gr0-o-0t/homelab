# ─────────────────────────────────────────────────────────────────────────────
# Service: Ollama (local large language model runner)
# https://ollama.com
# ─────────────────────────────────────────────────────────────────────────────

networks:
  # Shared network — Caddy (via Tailscale namespace) reaches every service here
  home-services:
    name: home-services
    external: true

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    # No `user:` — models and keys live under /root/.ollama, and /root is 0700
    # in the image, so any other uid fails on its first write.
    restart: always
    environment:
      OLLAMA_KEEP_ALIVE: ${KEEP_ALIVE:-5m}
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - home-services
    # Uncomment the block below to enable NVIDIA GPU support.
    # Requires nvidia-container-toolkit installed on the host.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    healthcheck:
      # The image has neither wget nor curl; the CLI queries the local server.
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  ollama-data:
    name: ollama_data
