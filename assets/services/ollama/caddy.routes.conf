# Route body for Ollama — directives only, no site address and no TLS import.
# `homelab enable` wraps this in whichever site address each layer needs, so
# the routes are defined once instead of once per layer.

# Ollama responses can be large and streamed; flush_interval -1 disables
# response buffering so tokens are delivered to the client immediately.
reverse_proxy ollama:11434 {
    flush_interval -1
}
