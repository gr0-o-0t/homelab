# ─────────────────────────────────────────────────────────────────────────────
# Service: AFFiNE (docs, whiteboards and databases in one workspace)
# https://github.com/toeverything/AFFiNE
# https://docs.affine.pro/self-host-affine
# Adapted from the release docker-compose.yml (v0.27.4).
#
# Differences from upstream, all deliberate:
#   - No postgres container. Uses shared homelab-postgres, which ships pgvector;
#     the `vector` and `pgcrypto` extensions are created by `homelab setup
#     affine` (see config.yaml `databases:`).
#   - No redis container. Uses shared homelab-redis on its own database number.
#   - No affine_migration job. Swarm has no "run once, then start the server"
#     ordering, so the server runs upstream's predeploy script (config upgrade,
#     private key on first boot, prisma + data migrations) before starting.
#     The script is idempotent; on a normal restart it only checks migrations.
#   - No host port: Caddy reaches 3010 over home-services. Websocket sync
#     (socket.io) is on the same port, so the default route is enough.
#   - Search indexer off, as upstream ships it: it needs Elasticsearch or
#     Manticore, which this homelab does not run.
#   - No SMTP. The first visit to /admin creates the admin account; without
#     mail, invite links and password resets are copied by hand from the panel.
#
# The crypto key (signs tokens, encrypts stored secrets) is generated by the
# predeploy script into affine_config/private.key and must survive with the
# database: losing it invalidates sessions and encrypted settings.
#
# First run:  homelab setup affine && homelab up affine && homelab enable affine
# Then open https://affine.<home>.<domain>/admin to create the admin account.
# ─────────────────────────────────────────────────────────────────────────────

networks:
  home-services:
    name: home-services
    external: true

services:
  affine:
    image: ghcr.io/toeverything/affine:stable
    container_name: affine
    restart: always
    command:
      - sh
      - -c
      - node ./scripts/self-host-predeploy.js && exec node ./dist/main.js
    environment:
      AFFINE_SERVER_EXTERNAL_URL: "https://affine.${HOME_SUBDOMAIN}.${DOMAIN}"
      DATABASE_URL: ${AFFINE_DATABASE_URL}
      REDIS_SERVER_HOST: ${AFFINE_REDIS_HOST}
      REDIS_SERVER_PORT: ${AFFINE_REDIS_PORT}
      REDIS_SERVER_PASSWORD: ${AFFINE_REDIS_PASSWORD}
      REDIS_SERVER_DATABASE: ${AFFINE_REDIS_DB}
      AFFINE_INDEXER_ENABLED: "false"
    volumes:
      - affine-storage:/root/.affine/storage
      - affine-config:/root/.affine/config
    networks:
      - home-services
    healthcheck:
      # The image is node:22-bookworm-slim without curl or wget.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3010/info').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 300s # first boot runs every migration before listening

volumes:
  affine-storage:
    name: affine_storage
  affine-config:
    name: affine_config
