# ─────────────────────────────────────────────────────────────────────────────
# Service: Mealie (self-hosted recipe manager and meal planner)
# https://docs.mealie.io
# ─────────────────────────────────────────────────────────────────────────────

networks:
  home-services:
    name: home-services
    external: true

services:
  mealie:
    image: ghcr.io/mealie-recipes/mealie:latest
    container_name: mealie
    # PUID/PGID env, not `user:` — the entrypoint starts as root, fixes
    # ownership of the root-owned /app/data volume, then gosu's to PUID:PGID.
    restart: always
    environment:
      BASE_URL: https://mealie.${HOME_SUBDOMAIN}.${DOMAIN}
      TZ: ${TZ:-UTC}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      MAX_WORKERS: 1
      WEB_CONCURRENCY: 1
    volumes:
      - mealie-data:/app/data
    networks:
      - home-services
    # No healthcheck block: the image has no wget, and ships its own
    # HEALTHCHECK ($MEALIE_HOME/healthcheck.sh) that Docker uses by default.

volumes:
  mealie-data:
    name: mealie_data
