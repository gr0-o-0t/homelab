# ─────────────────────────────────────────────────────────────────────────────
# Service: Miniflux (minimalist feed reader)
# https://miniflux.app/docs/installation.html#docker
# ─────────────────────────────────────────────────────────────────────────────
# Database: uses shared PostgreSQL (homelab-postgres). DB credentials and
# DATABASE_URL are auto-generated at `homelab service setup miniflux`.
# ─────────────────────────────────────────────────────────────────────────────

networks:
  home-services:
    name: home-services
    external: true

services:
  miniflux:
    image: miniflux/miniflux:latest
    container_name: miniflux
    user: "${PUID:-1000}:${PGID:-1000}"
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      RUN_MIGRATIONS: "1"
      CREATE_ADMIN: "1"
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    networks:
      - home-services
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://localhost:8080 2>/dev/null || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
