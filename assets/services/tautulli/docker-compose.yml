# ─────────────────────────────────────────────────────────────────────────────
# Service: Tautulli (Plex media server monitoring and statistics)
# https://tautulli.com/
# ─────────────────────────────────────────────────────────────────────────────

networks:
  home-services:
    name: home-services
    external: true

services:
  tautulli:
    image: lscr.io/linuxserver/tautulli:latest
    container_name: tautulli
    user: "${PUID:-1000}:${PGID:-1000}"
    restart: always
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
    volumes:
      - tautulli-config:/config
    networks:
      - home-services
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://localhost:8181 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  tautulli-config:
    name: tautulli_data
