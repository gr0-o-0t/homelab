# ─────────────────────────────────────────────────────────────────────────────
# Service: Tandoor Recipes (self-hosted recipe manager)
# https://docs.tandoor.dev/install/docker/
# ─────────────────────────────────────────────────────────────────────────────
# Database: uses shared PostgreSQL (homelab-postgres). Credentials
# auto-generated at `homelab service setup tandoor`.
# ─────────────────────────────────────────────────────────────────────────────

networks:
  home-services:
    name: home-services
    external: true

services:
  tandoor:
    image: vabene1111/recipes:latest
    container_name: tandoor
    user: "${PUID:-1000}:${PGID:-1000}"
    restart: always
    environment:
      SECRET_KEY: ${SECRET_KEY}
      DB_ENGINE: django.db.backends.postgresql
      POSTGRES_HOST: ${TA_DB_HOST}
      POSTGRES_PORT: ${TA_DB_PORT}
      POSTGRES_USER: ${TA_DB_USER}
      POSTGRES_PASSWORD: ${TA_DB_PASS}
      POSTGRES_DB: ${TA_DB_NAME}
      ALLOWED_HOSTS: "*"
      GUNICORN_MEDIA: 0
      TZ: ${TZ:-UTC}
    volumes:
      - tandoor-static:/opt/recipes/staticfiles
      - tandoor-media:/opt/recipes/mediafiles
    networks:
      - home-services
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://localhost:9001 2>/dev/null || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  tandoor-static:
    name: tandoor_static
  tandoor-media:
    name: tandoor_media
