# ─────────────────────────────────────────────────────────────────────────────
# Service: Tandoor Recipes (self-hosted recipe manager)
# https://docs.tandoor.dev/install/docker/
#
# Tandoor 2 bundles nginx: it listens on :80, serves media/static itself and
# proxies the rest to gunicorn on a unix socket (the old :8080 is gone).
# ─────────────────────────────────────────────────────────────────────────────
# Database: uses shared PostgreSQL (homelab-postgres). Credentials
# auto-generated at `homelab service setup tandoor`.
# ─────────────────────────────────────────────────────────────────────────────

networks:
  home-services:
    name: home-services
    external: true

services:
  tandoor:
    image: vabene1111/recipes:latest
    container_name: tandoor
    # No `user:`: staticfiles/mediafiles do not exist in the image, so the
    # named volumes start root-owned and collectstatic would fail as non-root.
    restart: always
    environment:
      SECRET_KEY: ${SECRET_KEY}
      DB_ENGINE: django.db.backends.postgresql
      POSTGRES_HOST: ${TA_DB_HOST}
      POSTGRES_PORT: ${TA_DB_PORT}
      POSTGRES_USER: ${TA_DB_USER}
      POSTGRES_PASSWORD: ${TA_DB_PASS}
      POSTGRES_DB: ${TA_DB_NAME}
      ALLOWED_HOSTS: "*"
      TZ: ${TZ:-UTC}
    volumes:
      - tandoor-static:/opt/recipes/staticfiles
      - tandoor-media:/opt/recipes/mediafiles
    networks:
      - home-services
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://localhost:80 2>/dev/null || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  tandoor-static:
    name: tandoor_static
  tandoor-media:
    name: tandoor_media
