vars:
  TZ:
    value: "UTC"
    required: false

secrets:
  SECRET_KEY:
    required: true
    description: "Django secret key - signs sessions and tokens; changing it logs everyone out"

databases:
  - postgres:
      database: tandoor
      user: tandoor
      env:
        host: TA_DB_HOST
        port: TA_DB_PORT
        user: TA_DB_USER
        password: TA_DB_PASS
        database: TA_DB_NAME
ports:
  - 9001