# Route body for Jellyfin — directives only, no site address and no TLS import.
# `homelab enable` wraps this in whichever site address each layer needs, so
# the routes are defined once instead of once per layer.

reverse_proxy jellyfin:8096 {
    # Jellyfin requires the real client IP for geo-features and logging.
    header_up X-Real-IP {remote_host}
    header_up X-Forwarded-For {remote_host}
    header_up X-Forwarded-Proto {scheme}
}
