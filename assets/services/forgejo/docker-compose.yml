# ─────────────────────────────────────────────────────────────────────────────
# Service: Forgejo (self-hosted Git service, Gitea fork)
# https://forgejo.org/docs/latest/admin/installation/
# ─────────────────────────────────────────────────────────────────────────────
# Database: uses shared PostgreSQL (homelab-postgres). DB credentials are
# auto-generated at `homelab service setup forgejo` and injected at runtime.
# ─────────────────────────────────────────────────────────────────────────────

networks:
  home-services:
    name: home-services
    external: true

services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:15-rootless
    container_name: forgejo
    user: "${PUID:-1000}:${PGID:-1000}"
    restart: always
    environment:
      USER_UID: ${PUID:-1000}
      USER_GID: ${PGID:-1000}
      FORGEJO__database__DB_TYPE: postgres
      FORGEJO__database__HOST: ${F_DB_HOST}:${F_DB_PORT}
      FORGEJO__database__NAME: ${F_DB_NAME}
      FORGEJO__database__USER: ${F_DB_USER}
      FORGEJO__database__PASSWD: ${F_DB_PASS}
      FORGEJO__server__DOMAIN: forgejo.${HOME_SUBDOMAIN}.${DOMAIN}
      FORGEJO__server__ROOT_URL: https://forgejo.${HOME_SUBDOMAIN}.${DOMAIN}
      FORGEJO__server__SSH_DOMAIN: forgejo.${HOME_SUBDOMAIN}.${DOMAIN}
    volumes:
      - forgejo-data:/var/lib/gitea
      - forgejo-config:/etc/gitea
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - home-services
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://localhost:3000 2>/dev/null || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  forgejo-data:
    name: forgejo_data
  forgejo-config:
    name: forgejo_config
