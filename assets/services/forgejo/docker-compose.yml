# ─────────────────────────────────────────────────────────────────────────────
# Service: Forgejo (self-hosted Git service, Gitea fork)
# https://forgejo.org/docs/latest/admin/installation/
# ─────────────────────────────────────────────────────────────────────────────

networks:
  home-services:
    name: home-services
    external: true
  forgejo-internal:
    internal: true

services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:15-rootless
    container_name: forgejo
    user: "${PUID:-1000}:${PGID:-1000}"
    restart: unless-stopped
    environment:
      USER_UID: ${PUID:-1000}
      USER_GID: ${PGID:-1000}
      FORGEJO__database__DB_TYPE: postgres
      FORGEJO__database__HOST: forgejo-postgres:5432
      FORGEJO__database__NAME: forgejo
      FORGEJO__database__USER: forgejo
      FORGEJO__database__PASSWD: ${DB_PASSWORD}
      FORGEJO__server__DOMAIN: forgejo.${HOME_SUBDOMAIN}.${DOMAIN}
      FORGEJO__server__ROOT_URL: https://forgejo.${HOME_SUBDOMAIN}.${DOMAIN}
      FORGEJO__server__SSH_DOMAIN: forgejo.${HOME_SUBDOMAIN}.${DOMAIN}
    volumes:
      - forgejo-data:/var/lib/gitea
      - forgejo-config:/etc/gitea
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - home-services
      - forgejo-internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://localhost:3000 2>/dev/null || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  forgejo-postgres:
    image: postgres:18-alpine
    container_name: forgejo-postgres
    user: "${PUID:-1000}:${PGID:-1000}"
    restart: unless-stopped
    environment:
      POSTGRES_USER: forgejo
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: forgejo
    volumes:
      - forgejo-pgdata:/var/lib/postgresql/data
    networks:
      - forgejo-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgejo"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  forgejo-data:
    name: forgejo_data
  forgejo-pgdata:
    name: forgejo_pgdata
  forgejo-config:
    name: forgejo_config
