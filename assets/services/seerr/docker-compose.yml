# ─────────────────────────────────────────────────────────────────────────────
# Service: Seerr (media discovery and request management)
# https://github.com/seerr-team/seerr
#
# Was lscr.io/linuxserver/overseerr:latest. Overseerr merged with Jellyseerr
# into Seerr, and LinuxServer deprecated their image on 2026-02-16, pointing at
# the official Seerr build. Deprecated LSIO images stop receiving updates and
# eventually lose their `latest` tag, so this now tracks upstream directly.
# https://info.linuxserver.io/issues/2026-02-16-overseerr/
#
# Migrating: Seerr reads the same /config layout, so the existing seerr_data
# volume carries over. Take a copy of it first — this is a fork merge, not a
# point release, and a rollback needs the old data intact.
# ─────────────────────────────────────────────────────────────────────────────

networks:
  home-services:
    name: home-services
    external: true

services:
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    user: "${PUID:-1000}:${PGID:-1000}"
    restart: always
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
    volumes:
      - seerr-config:/config
    networks:
      - home-services
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://localhost:5055 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  seerr-config:
    name: seerr_data
