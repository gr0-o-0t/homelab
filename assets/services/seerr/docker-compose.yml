# ─────────────────────────────────────────────────────────────────────────────
# Service: Seerr (media discovery and request management)
# https://github.com/seerr-team/seerr
#
# Was lscr.io/linuxserver/overseerr:latest. Overseerr merged with Jellyseerr
# into Seerr, and LinuxServer deprecated their image on 2026-02-16, pointing at
# the official Seerr build. Deprecated LSIO images stop receiving updates and
# eventually lose their `latest` tag, so this now tracks upstream directly.
# https://info.linuxserver.io/issues/2026-02-16-overseerr/
#
# Migrating: Seerr keeps the same config layout but at /app/config (LSIO used
# /config), so the existing seerr_data volume carries over at the new path. Take a copy of it first — this is a fork merge, not a
# point release, and a rollback needs the old data intact.
# ─────────────────────────────────────────────────────────────────────────────

networks:
  home-services:
    name: home-services
    external: true

services:
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    # No `user:`/PUID: the image already runs as node (uid 1000) and owns
    # /app/config, so a fresh named volume inherits the right owner.
    init: true
    restart: always
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - seerr-config:/app/config
    networks:
      - home-services
    healthcheck:
      test:
        ["CMD-SHELL", "wget -q --spider http://localhost:5055/api/v1/settings/public || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  seerr-config:
    name: seerr_data
