# ─────────────────────────────────────────────────────────────────────────────
# Service: Audiobookshelf (self-hosted audiobook and podcast server)
# https://www.audiobookshelf.org/docs#docker-install
# ─────────────────────────────────────────────────────────────────────────────

networks:
  home-services:
    name: home-services
    external: true

services:
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    # No `user:` — /config and /metadata don't exist in the image, so fresh
    # named volumes are root-owned and a non-root process can't initialise them.
    restart: always
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - ${AUDIOBOOKS_PATH:-/mnt/audiobooks}:/audiobooks:ro
      - ${PODCASTS_PATH:-/mnt/podcasts}:/podcasts # writable: podcast episodes are downloaded here
      - audiobookshelf-config:/config
      - audiobookshelf-metadata:/metadata
    networks:
      - home-services
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/healthcheck || exit 1"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  audiobookshelf-config:
    name: audiobookshelf_config
  audiobookshelf-metadata:
    name: audiobookshelf_metadata
