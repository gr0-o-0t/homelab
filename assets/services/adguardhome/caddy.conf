# Admin panel and DNS-over-HTTPS share AdGuard's web port (keep it at 3000 in
# the first-run wizard). Caddy terminates TLS
# and DoH arrives as plain HTTP on /dns-query, so set `allow_unencrypted_doh:
# true` in AdGuardHome.yaml. Plain DNS, DoT, DoQ and DNSCrypt are not HTTP and
# cannot go through Caddy — they are published on DNS_BIND_IP in compose.
adguardhome.{$HOME_SUBDOMAIN}.{$DOMAIN} {
    import wildcard_tls

    reverse_proxy adguardhome:3000
}
