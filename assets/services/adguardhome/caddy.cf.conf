# Public layer serves DNS-over-HTTPS only; the admin panel stays on the tailnet.
# Requires `allow_unencrypted_doh: true` in AdGuardHome.yaml (see caddy.conf).
http://adguardhome.{$DOMAIN} {
    handle /dns-query* {
        reverse_proxy adguardhome:3000
    }
    handle {
        respond 404
    }
}
