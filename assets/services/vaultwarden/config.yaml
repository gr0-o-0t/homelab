vars:
  VAULTWARDEN_VERSION:
    value: "latest"
    required: false
    description: "Vaultwarden image tag. Pin a version to control upgrade timing"
  SIGNUPS_ALLOWED:
    value: "false"
    required: false
  SIGNUPS_VERIFY:
    value: "true"
    required: false
  SMTP_HOST:
    value: ""
    required: false
  SMTP_FROM:
    value: ""
    required: false
  SMTP_PORT:
    value: "587"
    required: false
  SMTP_SECURITY:
    value: "starttls"
    required: false
  SMTP_USERNAME:
    value: ""
    required: false

secrets:
  ADMIN_TOKEN:
    required: true
    description: "Argon2 hash or plain token guarding /admin - leave unset to disable the admin panel entirely"
  SMTP_PASSWORD:
    required: false
    description: "Password for the SMTP account, only needed if mail is configured"
ports:
  - vault:80
