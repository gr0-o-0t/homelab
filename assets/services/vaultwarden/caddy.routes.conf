# Route body for Vaultwarden — directives only, no site address and no TLS import.
# `homelab enable` wraps this in whichever site address each layer needs, so
# the routes are defined once instead of once per layer.

reverse_proxy vaultwarden:80

# Vaultwarden's WebSocket endpoint (live sync notifications)
reverse_proxy /notifications/hub vaultwarden:3012
reverse_proxy /notifications/hub/negotiate vaultwarden:80

# Rate-limit the admin panel
@admin {
    path /admin*
}
rate_limit @admin {
    zone admin_zone {
        key    {remote_host}
        events 5
        window 1m
    }
}
