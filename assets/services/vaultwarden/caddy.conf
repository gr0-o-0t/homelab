vault.{$HOME_SUBDOMAIN}.{$DOMAIN} {
    import wildcard_tls

    reverse_proxy vaultwarden:80

    # Vaultwarden's WebSocket endpoint (live sync notifications)
    reverse_proxy /notifications/hub vaultwarden:3012
    reverse_proxy /notifications/hub/negotiate vaultwarden:80

    # Rate-limit the admin panel
    @admin {
        path /admin*
    }
    rate_limit @admin {
        zone admin_zone {
            key    {remote_host}
            events 5
            window 1m
        }
    }
}
