# ─────────────────────────────────────────────────────────────────────────────
# Service: Portainer (Docker management UI)
# https://github.com/portainer/portainer
# ─────────────────────────────────────────────────────────────────────────────

networks:
  home-services:
    name: home-services
    external: true

services:
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    user: "${PUID:-1000}:${PGID:-1000}"
    restart: always
    volumes:
      - portainer-data:/data
      # Read-WRITE Docker socket, unlike the :ro mounts in dozzle/homepage/
      # homarr/uptime-kuma. Portainer needs it to create and destroy
      # containers, but write access to the socket is equivalent to root on
      # the host: anyone who reaches this UI can mount / into a new container.
      # Keep it off the --cf/public layers and behind the tailnet.
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - home-services
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://localhost:9000 2>/dev/null || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  portainer-data:
    name: portainer_data
