# ─────────────────────────────────────────────────────────────────────────────
# Service: Portainer (Docker management UI)
# https://github.com/portainer/portainer
# ─────────────────────────────────────────────────────────────────────────────

networks:
  home-services:
    name: home-services
    external: true

services:
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    user: "${PUID:-1000}:${PGID:-1000}"
    restart: unless-stopped
    volumes:
      - portainer-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - home-services
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://localhost:9000 2>/dev/null || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  portainer-data:
    name: portainer_data
