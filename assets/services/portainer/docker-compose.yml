# ─────────────────────────────────────────────────────────────────────────────
# Service: Portainer (Docker management UI)
# https://github.com/portainer/portainer
# ─────────────────────────────────────────────────────────────────────────────

networks:
  home-services:
    name: home-services
    external: true

services:
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    # No `user:`: a non-root uid cannot open the root:docker 0660 socket,
    # which is the whole point of this container.
    restart: always
    volumes:
      - portainer-data:/data
      # Read-WRITE Docker socket, unlike the :ro mounts in dozzle/homepage/
      # homarr/uptime-kuma. Portainer needs it to create and destroy
      # containers, but write access to the socket is equivalent to root on
      # the host: anyone who reaches this UI can mount / into a new container.
      # Keep it off the --cf/public layers and behind the tailnet.
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - home-services
    # No healthcheck: the image is a static binary on a scratch-like base with
    # no shell, wget or curl, so any CMD-SHELL probe reports unhealthy forever.

volumes:
  portainer-data:
    name: portainer_data
