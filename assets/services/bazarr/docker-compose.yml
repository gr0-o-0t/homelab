# ─────────────────────────────────────────────────────────────────────────────
# Service: Bazarr (subtitle management companion for Sonarr and Radarr)
# https://wiki.bazarr.media/
# ─────────────────────────────────────────────────────────────────────────────

networks:
  home-services:
    name: home-services
    external: true

services:
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    # linuxserver.io image: its init needs root and drops to PUID/PGID itself,
    # so those go in the environment, not in `user:`.
    restart: always
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
    volumes:
      - bazarr-config:/config
      - ${MEDIA_PATH:-/mnt/media}/movies:/movies
      - ${MEDIA_PATH:-/mnt/media}/tv:/tv
    networks:
      - home-services
    healthcheck:
      test: ["CMD", "pgrep", "-f", "bazarr"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  bazarr-config:
    name: bazarr_data
