# ─────────────────────────────────────────────────────────────────────────────
# Service: Dozzle (real-time Docker log viewer)
# https://github.com/amir20/dozzle
# ─────────────────────────────────────────────────────────────────────────────

networks:
  home-services:
    name: home-services
    external: true

services:
  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    restart: always
    volumes:
      # Runs as root to read the socket (root:docker 0660). Even :ro, the Docker
      # API socket is root-equivalent on the host — keep dozzle private-only.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - dozzle-data:/data
    networks:
      - home-services
    healthcheck:
      test: ["CMD", "/dozzle", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  dozzle-data:
    name: dozzle_data
