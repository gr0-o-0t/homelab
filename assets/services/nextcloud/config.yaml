vars:
  NEXTCLOUD_VERSION:
    value: "latest"
    required: false
    description: "Nextcloud image tag. Pin a major (e.g. 31-apache) before a big upgrade - Nextcloud refuses to start on a downgrade, so never pin below the running version"
  ADMIN_USER:
    value: "admin"
    required: false

secrets:
  ADMIN_PASSWORD:
    required: true
    description: "Password for the admin account created on first start"

databases:
  - mariadb:
      database: nextcloud
      user: nextcloud
      env:
        host: NC_DB_HOST
        port: NC_DB_PORT
        user: NC_DB_USER
        password: NC_DB_PASS
        database: NC_DB_NAME
  - redis:
      env:
        host: NC_REDIS_HOST
ports:
  - 80