# Route body for Nextcloud — directives only, no site address and no TLS import.
# `homelab enable` wraps this in whichever site address each layer needs, so
# the routes are defined once instead of once per layer.

reverse_proxy nextcloud:80

# Required by Nextcloud — propagate real client IP.
header_up X-Real-IP {remote_host}
header_up X-Forwarded-For {remote_host}
header_up X-Forwarded-Proto {scheme}

# Nextcloud well-known redirects.
redir /.well-known/carddav /remote.php/dav 301
redir /.well-known/caldav  /remote.php/dav 301
