# ─────────────────────────────────────────────────────────────────────────────
# Service: Nextcloud (self-hosted cloud storage and collaboration)
# https://hub.docker.com/_/nextcloud
# ─────────────────────────────────────────────────────────────────────────────
# Database: uses shared PostgreSQL (homelab-postgres) and shared Redis
# (homelab-redis). Credentials auto-generated at `homelab setup nextcloud`.
#
# ⚠ An install created against the old shared MariaDB keeps dbtype=mysql in
# config/config.php — the POSTGRES_* variables only drive the first-run
# installer. Move it with Nextcloud's own converter before relying on postgres:
#   homelab up postgres && homelab setup nextcloud   # creates db + role
#   docker exec -u 1000 nextcloud php occ db:convert-type --all-apps \
#       --password "<NC_DB_PASS>" pgsql nextcloud homelab-postgres nextcloud
# Healthcheck uses curl: the image has no wget (busybox-static ships without
# applet symlinks).
# ─────────────────────────────────────────────────────────────────────────────

networks:
  home-services:
    name: home-services
    external: true

services:
  nextcloud:
    image: nextcloud:${NEXTCLOUD_VERSION:-latest}
    container_name: nextcloud
    user: "${PUID:-1000}:${PGID:-1000}"
    restart: always
    environment:
      # The installer takes the port as part of the host.
      POSTGRES_HOST: ${NC_DB_HOST}:${NC_DB_PORT}
      POSTGRES_DB: ${NC_DB_NAME}
      POSTGRES_USER: ${NC_DB_USER}
      POSTGRES_PASSWORD: ${NC_DB_PASS}
      NEXTCLOUD_ADMIN_USER: ${ADMIN_USER:-admin}
      NEXTCLOUD_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      NEXTCLOUD_TRUSTED_DOMAINS: nextcloud.${HOME_SUBDOMAIN}.${DOMAIN}
      REDIS_HOST: ${NC_REDIS_HOST}
      REDIS_HOST_PORT: ${NC_REDIS_PORT}
      REDIS_HOST_PASSWORD: ${NC_REDIS_PASSWORD}
      OVERWRITEPROTOCOL: https
    volumes:
      - nextcloud-data:/var/www/html
    networks:
      - home-services
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost/status.php >/dev/null || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

volumes:
  nextcloud-data:
    name: nextcloud_data
