# ─────────────────────────────────────────────────────────────────────────────
# Service: Nextcloud (self-hosted cloud storage and collaboration)
# https://hub.docker.com/_/nextcloud
# ─────────────────────────────────────────────────────────────────────────────
# Database: uses shared MariaDB (homelab-mariadb) and shared Redis
# (homelab-redis). Credentials auto-generated at `homelab service setup nextcloud`.
# ─────────────────────────────────────────────────────────────────────────────

networks:
  home-services:
    name: home-services
    external: true

services:
  nextcloud:
    image: nextcloud:${NEXTCLOUD_VERSION:-latest}
    container_name: nextcloud
    user: "${PUID:-1000}:${PGID:-1000}"
    restart: unless-stopped
    environment:
      MYSQL_HOST: ${NC_DB_HOST}
      MYSQL_PORT: ${NC_DB_PORT}
      MYSQL_DATABASE: ${NC_DB_NAME}
      MYSQL_USER: ${NC_DB_USER}
      MYSQL_PASSWORD: ${NC_DB_PASS}
      NEXTCLOUD_ADMIN_USER: ${ADMIN_USER:-admin}
      NEXTCLOUD_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      NEXTCLOUD_TRUSTED_DOMAINS: nextcloud.${HOME_SUBDOMAIN}.${DOMAIN}
      REDIS_HOST: ${NC_REDIS_HOST}
      OVERWRITEPROTOCOL: https
    volumes:
      - nextcloud-data:/var/www/html
    networks:
      - home-services
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://localhost/status.php 2>/dev/null || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

volumes:
  nextcloud-data:
    name: nextcloud_data
