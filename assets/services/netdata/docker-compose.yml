# ─────────────────────────────────────────────────────────────────────────────
# Service: Netdata (real-time metrics for every node in the cluster)
# https://github.com/netdata/netdata/blob/master/packaging/docker/README.md
# ─────────────────────────────────────────────────────────────────────────────
# A parent on the core node keeps the history and serves the dashboard. An
# agent runs on every node (deploy.mode: global, joining nodes included) and
# streams to the parent over home-services; the parent shows each node by its
# Swarm hostname.
#
# Differences from the upstream compose, forced by Swarm:
#   - no `pid: host`: `init: true` instead, as upstream requires; apps.plugin
#     sees the agent's own processes, not the host's.
#   - no `network_mode: host`: no host NIC / network-stack charts, no
#     local-listeners and no go.d auto-discovery of apps on the host. CPU,
#     memory, disks, filesystems, sensors and per-container cgroups remain.
#   - `/:/host/root` without rslave: filesystems mounted later are not seen.
#
# NETDATA_STREAM_KEY is generated by homelab (hex) and reshaped into the UUID
# Netdata wants when a container starts; stream.conf lives only in the
# container, never on disk.
# ─────────────────────────────────────────────────────────────────────────────

networks:
  home-services:
    name: home-services
    external: true

services:
  netdata:
    image: netdata/netdata:stable
    container_name: netdata
    hostname: netdata-parent
    restart: always
    environment:
      NETDATA_STREAM_KEY: ${NETDATA_STREAM_KEY}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        key=$$(printf %s "$$NETDATA_STREAM_KEY" | sed -E 's/^(.{8})(.{4})(.{4})(.{4})(.{12}).*/\1-\2-\3-\4-\5/')
        printf '[%s]\n    type = api\n    enabled = yes\n    db = dbengine\n' "$$key" > /etc/netdata/stream.conf
        chown root:netdata /etc/netdata/stream.conf && chmod 640 /etc/netdata/stream.conf
        exec /usr/sbin/run.sh
    volumes:
      - netdata-lib:/var/lib/netdata
      - netdata-cache:/var/cache/netdata
    networks:
      - home-services

  netdata-agent:
    image: netdata/netdata:stable
    container_name: netdata-agent
    hostname: "{{.Node.Hostname}}"
    restart: always
    init: true
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    environment:
      NETDATA_STREAM_KEY: ${NETDATA_STREAM_KEY}
    # Metrics live in the parent: the agent keeps only a RAM buffer.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        key=$$(printf %s "$$NETDATA_STREAM_KEY" | sed -E 's/^(.{8})(.{4})(.{4})(.{4})(.{12}).*/\1-\2-\3-\4-\5/')
        printf '[stream]\n    enabled = yes\n    destination = netdata:19999\n    api key = %s\n' "$$key" > /etc/netdata/stream.conf
        chown root:netdata /etc/netdata/stream.conf && chmod 640 /etc/netdata/stream.conf
        printf '\n[db]\n    mode = ram\n' >> /etc/netdata/netdata.conf
        exec /usr/sbin/run.sh
    volumes:
      - netdata-agent-lib:/var/lib/netdata   # the node's identity, per node
      - /:/host/root:ro
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /etc/localtime:/etc/localtime:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /var/log:/host/var/log:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /run/dbus:/run/dbus:ro
    networks:
      - home-services
    deploy:
      mode: global

volumes:
  netdata-lib:
    name: netdata_lib
  netdata-cache:
    name: netdata_cache
  netdata-agent-lib:
    name: netdata-agent_lib
