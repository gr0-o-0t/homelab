# ─────────────────────────────────────────────────────────────────────────────
# Service: Stirling PDF (self-hosted PDF manipulation tool)
# https://github.com/Stirling-Tools/Stirling-PDF
# https://docs.stirlingpdf.com/Server/Install/Docker/
#
# `latest` bundles LibreOffice, Tesseract and OCRmyPDF; upstream suggests 4 GB
# of memory (`mem_limit` is ignored under Swarm, so it is not set here).
# ─────────────────────────────────────────────────────────────────────────────

networks:
  home-services:
    name: home-services
    external: true

services:
  stirlingpdf:
    # Official registry; Docker Hub (stirlingtools/stirling-pdf) and
    # ghcr.io/stirling-tools/stirling-pdf are mirrors.
    image: docker.stirlingpdf.com/stirlingtools/stirling-pdf:latest
    container_name: stirlingpdf
    # No `user:`: the mounted dirs do not exist in the image, so the named
    # volumes start root-owned. init.sh runs as root and drops to PUID/PGID.
    restart: always
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      # Spring binds security.enableLogin from SECURITY_ENABLELOGIN; the old
      # SECURITY_ENABLE_LOGIN / DOCKER_ENABLE_SECURITY names are ignored.
      SECURITY_ENABLELOGIN: "false"
      LANGS: en_US
    volumes:
      - stirlingpdf-data:/usr/share/tessdata # extra OCR languages
      - stirlingpdf-configs:/configs # settings.yml, built-in DB, keys
      - stirlingpdf-logs:/logs
      - stirlingpdf-storage:/storage # files users save (on by default)
      - stirlingpdf-customfiles:/customFiles # branding, signatures
      - stirlingpdf-pipeline:/pipeline # folder-scan watched/finished dirs
    networks:
      - home-services
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fs --max-time 10 http://localhost:8080/api/v1/info/status || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  stirlingpdf-data:
    name: stirlingpdf_data
  stirlingpdf-configs:
    name: stirlingpdf_configs
  stirlingpdf-logs:
    name: stirlingpdf_logs
  stirlingpdf-storage:
    name: stirlingpdf_storage
  stirlingpdf-customfiles:
    name: stirlingpdf_customfiles
  stirlingpdf-pipeline:
    name: stirlingpdf_pipeline
