# ─────────────────────────────────────────────────────────────────────────────
# Service: Stirling PDF (self-hosted PDF manipulation tool)
# https://github.com/Stirling-Tools/Stirling-PDF
# ─────────────────────────────────────────────────────────────────────────────

networks:
  home-services:
    name: home-services
    external: true

services:
  stirlingpdf:
    image: stirlingtools/stirling-pdf:latest
    container_name: stirlingpdf
    # No `user:`: /configs and /logs do not exist in the image, so the named
    # volumes start root-owned. init.sh runs as root and drops to PUID/PGID.
    restart: always
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      # Spring binds security.enableLogin from SECURITY_ENABLELOGIN; the old
      # SECURITY_ENABLE_LOGIN / DOCKER_ENABLE_SECURITY names are ignored.
      SECURITY_ENABLELOGIN: "false"
      LANGS: en_US
    volumes:
      - stirlingpdf-data:/usr/share/tessdata
      - stirlingpdf-configs:/configs
      - stirlingpdf-logs:/logs
    networks:
      - home-services
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fs --max-time 10 http://localhost:8080/api/v1/info/status || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  stirlingpdf-data:
    name: stirlingpdf_data
  stirlingpdf-configs:
    name: stirlingpdf_configs
  stirlingpdf-logs:
    name: stirlingpdf_logs
