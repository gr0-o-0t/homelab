# Caddy routes for Plane — the body of a site block, no site address.
#
# Presigned upload/download URLs, used directly by the browser (and by Plane's
# own server-side S3 calls). Plane signs them for
# https://<this host>/plane-uploads/<key> because AWS_S3_ENDPOINT_URL is this
# host — see docker-compose.yml. Caddy forwards the original Host, which is
# the one the signature covers, so garage accepts them unchanged. The
# signature is the authorisation: garage refuses anything unsigned or for
# another bucket. The path is the bucket name in config.yaml.
handle /plane-uploads/* {
	reverse_proxy homelab-garage:3900
}

# Everything else: the AIO image's own Caddy, which fans out to the web app,
# /god-mode, /spaces, /api, /auth and the /live websocket.
handle {
	reverse_proxy plane:80
}
