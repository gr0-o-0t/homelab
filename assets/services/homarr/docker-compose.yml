# ─────────────────────────────────────────────────────────────────────────────
# Service: Homarr (intuitive homelab dashboard)
# https://github.com/homarr-labs/homarr
# ─────────────────────────────────────────────────────────────────────────────

networks:
  home-services:
    name: home-services
    external: true

services:
  homarr:
    image: ghcr.io/homarr-labs/homarr:latest
    container_name: homarr
    restart: always
    environment:
      SECRET_ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      # The entrypoint starts as root, chowns /appdata and the nginx dirs, then
      # drops to PUID:PGID — `user:` would skip that and break nginx/redis.
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    volumes:
      - homarr-data:/appdata
      # No docker.sock: it is root-equivalent on the host and unreadable by
      # PUID anyway. Add it (and run as root) only if you need the Docker widget.
    networks:
      - home-services
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://localhost:7575 2>/dev/null || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  homarr-data:
    name: homarr_data
