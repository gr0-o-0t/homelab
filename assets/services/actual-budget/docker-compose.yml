# ─────────────────────────────────────────────────────────────────────────────
# Service: Actual Budget (local-first personal finance tool)
# https://actualbudget.org/docs/install/docker/
# ─────────────────────────────────────────────────────────────────────────────

networks:
  home-services:
    name: home-services
    external: true

services:
  actual-budget:
    image: actualbudget/actual-server:latest-alpine
    container_name: actual-budget
    restart: always
    volumes:
      - actual-budget-data:/data
    networks:
      - home-services
    healthcheck:
      test: ["CMD-SHELL", "node src/scripts/health-check.js"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  actual-budget-data:
    name: actual-budget_data
