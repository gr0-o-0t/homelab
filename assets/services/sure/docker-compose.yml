# ─────────────────────────────────────────────────────────────────────────────
# Service: Sure (personal finance and wealth management, a Maybe Finance fork)
# https://github.com/we-promise/sure
# https://docs.sure.am/self-hosting
# Adapted from compose.example.yml.
#
# Differences from upstream, all deliberate:
#   - No db or redis container. Uses shared homelab-postgres (database and role
#     `sure`, pgcrypto pre-created) and its own database number on homelab-redis.
#   - No backup / backup-offsite sidecars: `homelab backup sure` dumps the
#     database and the sure_storage volume. Secrets are not in backups, so keep
#     SECRET_KEY_BASE (homelab vault) — restoring without it leaves encrypted
#     provider credentials unreadable.
#   - No cloudflared service: `homelab enable sure --cf` publishes it instead.
#   - SECRET_KEY_BASE is generated by homelab on first `up`, not typed into .env.
#   - TLS ends at Caddy, so RAILS_ASSUME_SSL=true (secure cookies, https URLs)
#     and RAILS_FORCE_SSL=false (the healthcheck speaks plain http).
#   - APP_DOMAIN is the tailnet hostname; Sure derives the passkey RP ID and
#     allowed origin from it, so passkeys work without WEBAUTHN_* settings.
#   - `dns:` and `depends_on:` are dropped (Swarm ignores both). The web task
#     runs `db:prepare` on start; the worker restarts until the schema exists.
#   - No host port: Caddy reaches 3000 over home-services.
#
# Both containers mount sure_storage, so both are pinned to the core node.
#
# First run:  homelab setup sure && homelab up sure && homelab enable sure
# Then open https://sure.<home>.<domain> and register: the first account is
# the family admin.
# ─────────────────────────────────────────────────────────────────────────────

x-rails-env: &rails_env
  SELF_HOSTED: "true"
  APP_DOMAIN: "sure.${HOME_SUBDOMAIN}.${DOMAIN}"
  RAILS_FORCE_SSL: "false"
  RAILS_ASSUME_SSL: "true"
  SECRET_KEY_BASE: ${SECRET_KEY_BASE}
  DB_HOST: ${SURE_DB_HOST}
  DB_PORT: ${SURE_DB_PORT}
  POSTGRES_USER: ${SURE_DB_USER}
  POSTGRES_PASSWORD: ${SURE_DB_PASSWORD}
  POSTGRES_DB: ${SURE_DB_NAME}
  REDIS_URL: ${SURE_REDIS_URL}
  SMTP_ADDRESS: ${SMTP_ADDRESS}
  SMTP_PORT: ${SMTP_PORT}
  SMTP_USERNAME: ${SMTP_USERNAME}
  SMTP_PASSWORD: ${SMTP_PASSWORD}
  SMTP_TLS_ENABLED: ${SMTP_TLS_ENABLED}
  EMAIL_SENDER: ${EMAIL_SENDER}
  OPENAI_ACCESS_TOKEN: ${OPENAI_ACCESS_TOKEN}
  OPENAI_URI_BASE: ${OPENAI_URI_BASE}
  OPENAI_MODEL: ${OPENAI_MODEL}

networks:
  home-services:
    name: home-services
    external: true

services:
  sure:
    image: ghcr.io/we-promise/sure:${SURE_IMAGE_TAG:-stable}
    container_name: sure
    restart: always
    environment:
      <<: *rails_env
    volumes:
      - sure-storage:/rails/storage
    networks:
      - home-services
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/up"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 300s # first boot runs every migration before listening

  sure-worker:
    image: ghcr.io/we-promise/sure:${SURE_IMAGE_TAG:-stable}
    container_name: sure-worker
    restart: always
    command: bundle exec sidekiq
    environment:
      <<: *rails_env
    volumes:
      - sure-storage:/rails/storage
    networks:
      - home-services

volumes:
  sure-storage:
    name: sure_storage
