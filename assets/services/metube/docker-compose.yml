# ─────────────────────────────────────────────────────────────────────────────
# Service: MeTube (web GUI for yt-dlp — download videos from 1000+ sites)
# https://github.com/alexta69/metube
# ─────────────────────────────────────────────────────────────────────────────

networks:
  home-services:
    name: home-services
    external: true

services:
  metube:
    image: ghcr.io/alexta69/metube:latest
    container_name: metube
    # UID/GID env, not `user:` — the entrypoint starts as root, chowns the
    # root-owned /downloads volume, then gosu's to UID:GID.
    restart: always
    environment:
      DOWNLOAD_DIR: /downloads
      UID: ${PUID:-1000}
      GID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
    volumes:
      - metube-downloads:/downloads
    networks:
      - home-services
    # No healthcheck block: the image has no wget, and ships its own curl
    # HEALTHCHECK on ${PORT} that Docker uses by default.

volumes:
  metube-downloads:
    name: metube_downloads
