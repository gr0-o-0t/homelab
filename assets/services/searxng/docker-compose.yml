# Service: SearXNG (privacy-respecting metasearch engine)
# https://docs.searxng.org/admin/installation-docker.html
# db: uses shared Redis (homelab-redis). REDIS_URL is auto-generated
# from config.yaml `databases:` section at runtime.
networks:
  home-services:
    name: home-services
    external: true

services:
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: always
    environment:
      SEARXNG_BASE_URL: https://searxng.${HOME_SUBDOMAIN}.${DOMAIN}
      SEARXNG_SECRET_KEY: ${SECRET_KEY}
      REDIS_URL: ${SEARXNG_REDIS_URL}
    volumes:
      - searxng-config:/etc/searxng
    networks:
      - home-services
    healthcheck:
      test:
        - "CMD-SHELL"
        - "wget -q --spider http://localhost:8080 2>/dev/null || exit 1"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  searxng-config:
    name: searxng_config
