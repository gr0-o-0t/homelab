# Service: SearXNG (privacy-respecting metasearch engine)
# https://docs.searxng.org/admin/installation-docker.html
# db: uses shared Redis (homelab-redis) — redis://:<password>@homelab-redis:6379/<n>,
# generated from config.yaml `databases:` at runtime.
networks:
  home-services:
    name: home-services
    external: true

services:
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: always
    environment:
      SEARXNG_BASE_URL: https://searxng.${HOME_SUBDOMAIN}.${DOMAIN}
      # SearXNG reads server.secret_key from SEARXNG_SECRET and the cache /
      # limiter backend from SEARXNG_VALKEY_URL (redis.url is deprecated;
      # valkey-py accepts the redis:// DSN). The old SEARXNG_SECRET_KEY and
      # REDIS_URL names were silently ignored.
      SEARXNG_SECRET: ${SECRET_KEY}
      SEARXNG_VALKEY_URL: ${SEARXNG_REDIS_URL}
    volumes:
      - searxng-config:/etc/searxng
    networks:
      - home-services
    healthcheck:
      test:
        - "CMD-SHELL"
        - "wget -q --spider http://localhost:8080 2>/dev/null || exit 1"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  searxng-config:
    name: searxng_config
