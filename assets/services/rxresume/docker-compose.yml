# ─────────────────────────────────────────────────────────────────────────────
# Service: Reactive Resume (resume builder — edit, share and export to PDF)
# https://github.com/AmruthPillai/Reactive-Resume
# https://docs.rxresu.me/self-hosting/docker
# Adapted from the docker-compose.yml in the self-hosting docs.
#
# Differences from upstream, all deliberate:
#   - No postgres container. Uses shared homelab-postgres (database and role
#     `rxresume`); DATABASE_URL is injected by homelab.
#   - No env_file (unsupported here): every setting is listed below, and
#     AUTH_SECRET and ENCRYPTION_SECRET are generated by homelab on first `up`.
#     ENCRYPTION_SECRET is set from the start so users can save their own AI
#     keys; keep both secrets when restoring a backup.
#   - TLS ends at Caddy: APP_URL is the https tailnet URL, and the Swarm
#     overlay (10.0.0.0/8) is the trusted proxy, so rate limits key on real
#     client addresses rather than Caddy's.
#   - No Redis: one replica needs none (upstream's optional REDIS_URL is for
#     several processes and AI reply recovery across reloads).
#   - Uploads stay on local storage in a named volume, so
#     `homelab backup rxresume` covers them with the database.
#   - `depends_on` is dropped (Swarm ignores it); the image's own
#     HEALTHCHECK (/api/health) stays. No host port: Caddy reaches 3000 over
#     home-services.
#
# First run:  homelab setup rxresume && homelab up rxresume && homelab enable rxresume
# Then open https://rxresume.<home>.<domain> and sign up. Without SMTP
# no verification mail is sent, but the account works at once. Set
# FLAG_DISABLE_SIGNUPS=true afterwards to close registration.
# ─────────────────────────────────────────────────────────────────────────────

networks:
  home-services:
    name: home-services
    external: true

services:
  rxresume:
    image: amruthpillai/reactive-resume:${RXRESUME_IMAGE_TAG:-latest}
    container_name: rxresume
    restart: always
    environment:
      APP_URL: "https://rxresume.${HOME_SUBDOMAIN}.${DOMAIN}"
      DATABASE_URL: ${RXRESUME_DATABASE_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      ENCRYPTION_SECRET: ${ENCRYPTION_SECRET}
      TRUSTED_PROXIES: "10.0.0.0/8"
      FLAG_DISABLE_SIGNUPS: ${FLAG_DISABLE_SIGNUPS:-false}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      OAUTH_PROVIDER_NAME: ${OAUTH_PROVIDER_NAME}
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET}
      OAUTH_DISCOVERY_URL: ${OAUTH_DISCOVERY_URL}
      AI_PROVIDER: ${AI_PROVIDER}
      AI_MODEL: ${AI_MODEL}
      AI_API_KEY: ${AI_API_KEY}
      AI_BASE_URL: ${AI_BASE_URL}
      FLAG_ALLOW_UNSAFE_AI_BASE_URL: ${FLAG_ALLOW_UNSAFE_AI_BASE_URL:-false}
    volumes:
      - rxresume-data:/app/data
    networks:
      - home-services

volumes:
  rxresume-data:
    name: rxresume_data
