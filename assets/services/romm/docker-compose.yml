# ─────────────────────────────────────────────────────────────────────────────
# Service: RomM (ROM manager — scan, enrich and play a retro game library)
# https://github.com/rommapp/romm
# https://docs.romm.app/latest/getting-started/quick-start/
# Adapted from the quick-start docker-compose.yml.
#
# Differences from upstream, all deliberate:
#   - No romm-db container. Uses shared homelab-mariadb (database and account
#     `romm`). RomM's migrations create triggers, which MariaDB refuses to an
#     unprivileged account only while binary logging is on; the shared instance
#     runs with --skip-log-bin, so no log_bin_trust_function_creators is needed.
#   - No internal valkey: REDIS_HOST points RomM at its own database number on
#     homelab-redis (task queues and cache), so the image's /redis-data volume
#     is not mounted.
#   - ROMM_AUTH_SECRET_KEY is generated by homelab on first `up`, not typed in.
#   - TLS ends at Caddy, so ROMM_BASE_URL is the https tailnet URL (used for
#     reset and share links) and session cookies are marked Secure.
#   - The library is ${MEDIA_PATH}/games on the core node, writable so ROMs can
#     be uploaded from the UI. Lay it out as games/roms/<platform>/ (see the
#     folder-structure section of the README); the directory must exist before
#     `up`, or Swarm refuses the bind mount.
#   - resources, assets (saves, states, uploads) and config are named volumes,
#     so `homelab backup romm` covers them with the database. config.yml is
#     created and edited from the UI (Settings → Library).
#   - `depends_on` is dropped (Swarm ignores it); RomM waits for the database
#     itself. No host port: Caddy reaches 8080 over home-services.
#
# First run:  mkdir -p /mnt/media/games/roms on minis, then
#             homelab setup romm && homelab up romm && homelab enable romm
# Then open https://romm.<home>.<domain>: the setup wizard's first account is
# the admin. Set at least one metadata provider before the first scan.
# ─────────────────────────────────────────────────────────────────────────────

networks:
  home-services:
    name: home-services
    external: true

services:
  romm:
    image: rommapp/romm:${ROMM_IMAGE_TAG:-latest}
    container_name: romm
    restart: always
    environment:
      TZ: ${TZ:-UTC}
      ROMM_BASE_URL: "https://romm.${HOME_SUBDOMAIN}.${DOMAIN}"
      ROMM_SESSION_SECURE_COOKIE: "true"
      ROMM_AUTH_SECRET_KEY: ${ROMM_AUTH_SECRET_KEY}
      DB_HOST: ${ROMM_DB_HOST}
      DB_PORT: ${ROMM_DB_PORT}
      DB_NAME: ${ROMM_DB_NAME}
      DB_USER: ${ROMM_DB_USER}
      DB_PASSWD: ${ROMM_DB_PASSWORD}
      REDIS_HOST: ${ROMM_REDIS_HOST}
      REDIS_PORT: ${ROMM_REDIS_PORT}
      REDIS_PASSWORD: ${ROMM_REDIS_PASSWORD}
      REDIS_DB: ${ROMM_REDIS_DB}
      SCREENSCRAPER_USER: ${SCREENSCRAPER_USER}
      SCREENSCRAPER_PASSWORD: ${SCREENSCRAPER_PASSWORD}
      RETROACHIEVEMENTS_API_KEY: ${RETROACHIEVEMENTS_API_KEY}
      STEAMGRIDDB_API_KEY: ${STEAMGRIDDB_API_KEY}
      HASHEOUS_API_ENABLED: ${HASHEOUS_API_ENABLED}
    volumes:
      - romm-resources:/romm/resources
      - romm-assets:/romm/assets
      - romm-config:/romm/config
      - ${MEDIA_PATH:-/mnt/media}/games:/romm/library
    networks:
      - home-services
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s # migrations run before the API listens

volumes:
  romm-resources:
    name: romm_resources
  romm-assets:
    name: romm_assets
  romm-config:
    name: romm_config
