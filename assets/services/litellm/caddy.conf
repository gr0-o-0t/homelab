# Caddy site block for LiteLLM (private / tailnet).
# Enabled by: homelab enable litellm
# Metrics: scraped by the shared Prometheus instance (see prometheus-target.json),
# browsable at prometheus.{$HOME_SUBDOMAIN}.{$DOMAIN} once that service is enabled.

litellm.{$HOME_SUBDOMAIN}.{$DOMAIN} {
    import wildcard_tls

    reverse_proxy litellm:4000
}
