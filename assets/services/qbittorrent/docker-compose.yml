# ─────────────────────────────────────────────────────────────────────────────
# Service: qBittorrent (BitTorrent client with web UI)
# https://github.com/linuxserver/docker-qbittorrent
# ─────────────────────────────────────────────────────────────────────────────
# BitTorrent port 6881 is published on TORRENT_BIND_IP (loopback by default);
# see the ports section below.

networks:
  home-services:
    name: home-services
    external: true

services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    # No `user:`: LinuxServer images boot s6 as root, chown /config, then drop
    # to PUID/PGID. Forcing a uid breaks init and leaves /config unwritable.
    restart: always
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
      WEBUI_PORT: 8080
    volumes:
      - qbittorrent-config:/config
      - ${DOWNLOADS_PATH:-/mnt/downloads}:/downloads
    networks:
      - home-services
    ports:
      # BitTorrent peer port. Loopback by default (Docker bypasses ufw); set
      # TORRENT_BIND_IP to accept incoming peers.
      - "${TORRENT_BIND_IP:-127.0.0.1}:6881:6881"
      - "${TORRENT_BIND_IP:-127.0.0.1}:6881:6881/udp"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://localhost:8080 2>/dev/null || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  qbittorrent-config:
    name: qbittorrent_config
