# ─────────────────────────────────────────────────────────────────
# Shared Redis for homelab services
# ─────────────────────────────────────────────────────────────────

networks:
  home-services:
    name: home-services
    external: true

services:
  redis:
    image: redis:8-alpine
    container_name: homelab-redis
    restart: always
    volumes:
      - redis-data:/data
    networks:
      - home-services
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis-data:
    name: homelab_redis_data
