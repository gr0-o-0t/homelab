# ─────────────────────────────────────────────────────────────────────────────
# Service: IT Tools (collection of handy online tools for developers)
# https://github.com/CorentinTh/it-tools
# ─────────────────────────────────────────────────────────────────────────────

networks:
  home-services:
    name: home-services
    external: true

services:
  it-tools:
    image: corentinth/it-tools:latest
    container_name: it-tools
    # No `user:` — this is the stock nginx:alpine image, whose master process
    # must start as root to create /var/cache/nginx/*_temp and then drops its
    # workers to the nginx user itself. As uid 1000 it exits on mkdir EACCES.
    restart: always
    networks:
      - home-services
    healthcheck:
      test:
        ["CMD-SHELL", "wget -q --spider http://localhost 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
