# ─────────────────────────────────────────────────────────────────────────────
# Service: Beszel Hub (lightweight server monitoring dashboard)
# https://github.com/henrygd/beszel
# ─────────────────────────────────────────────────────────────────────────────

networks:
  home-services:
    name: home-services
    external: true

services:
  beszel-hub:
    image: ghcr.io/henrygd/beszel:latest
    container_name: beszel-hub
    user: "${PUID:-1000}:${PGID:-1000}"
    restart: always
    volumes:
      - beszel-hub-data:/beszel_data
    networks:
      - home-services
    healthcheck:
      test: ["CMD", "/beszel", "health", "--url", "http://localhost:8090"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  beszel-hub-data:
    name: beszel-hub_data
