# ─────────────────────────────────────────────────────────────────────────────
# Service: Uptime Kuma (self-hosted monitoring dashboard)
# https://github.com/louislam/uptime-kuma
# https://github.com/louislam/uptime-kuma#-docker-compose
#
# Data stays in upstream's default SQLite (kuma.db in /app/data) rather than
# the shared MariaDB: the monitor must not depend on a service it may watch.
# SQLite needs a local volume (upstream does not support NFS).
# 2-slim leaves out the embedded MariaDB and Chromium, so "Real Browser"
# monitors need a remote browser (Settings → Remote Browsers).
# The socket is the core node's: Docker monitors see only containers on minis.
# ─────────────────────────────────────────────────────────────────────────────

networks:
  home-services:
    name: home-services
    external: true

services:
  uptime-kuma:
    image: louislam/uptime-kuma:2-slim
    container_name: uptime-kuma
    # No `user:`: a non-root uid cannot open the root:docker 0660 socket, which
    # would silently break Docker container monitors.
    restart: always
    volumes:
      - uptime-kuma-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - home-services
    # No healthcheck override: the image ships HEALTHCHECK `extra/healthcheck`.
    # 2-slim is Debian slim without wget, so the old wget probe always failed.

volumes:
  uptime-kuma-data:
    name: uptime-kuma_data
