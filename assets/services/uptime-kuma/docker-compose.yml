# ─────────────────────────────────────────────────────────────────────────────
# Service: Uptime Kuma (self-hosted monitoring dashboard)
# https://github.com/louislam/uptime-kuma
# ─────────────────────────────────────────────────────────────────────────────

networks:
  home-services:
    name: home-services
    external: true

services:
  uptime-kuma:
    image: louislam/uptime-kuma:2-slim
    container_name: uptime-kuma
    # No `user:`: a non-root uid cannot open the root:docker 0660 socket, which
    # would silently break Docker container monitors.
    restart: always
    volumes:
      - uptime-kuma-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - home-services
    # No healthcheck override: the image ships HEALTHCHECK `extra/healthcheck`.
    # 2-slim is Debian slim without wget, so the old wget probe always failed.

volumes:
  uptime-kuma-data:
    name: uptime-kuma_data
