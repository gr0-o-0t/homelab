# Route body for Uptime Kuma — directives only, no site address and no TLS import.
# `homelab enable` wraps this in whichever site address each layer needs, so
# the routes are defined once instead of once per layer.

reverse_proxy uptime-kuma:3001 {
    # Uptime Kuma uses WebSockets for real-time updates
    header_up Connection {http.request.header.Connection}
    header_up Upgrade    {http.request.header.Upgrade}
}
