# ─────────────────────────────────────────────────────────────────────────────
# Service: Technitium DNS Server (authoritative and recursive DNS server)
# https://technitium.com/dns/
# ─────────────────────────────────────────────────────────────────────────────
# A DNS server needs host port 53 to answer queries, so it is bound below rather
# than left commented out — the web UI alone is not the point of this service.
#
# That makes technitium mutually exclusive with adguardhome and pihole: whichever
# starts second fails with "port is already allocated". Pick one resolver. The
# catalog test TestCatalogServices_HostPortConflictsAreKnown records all three as
# deliberate alternatives.

networks:
  home-services:
    name: home-services
    external: true

services:
  technitium:
    image: technitium/dns-server:latest
    container_name: technitium
    user: "${PUID:-1000}:${PGID:-1000}"
    restart: unless-stopped
    environment:
      DNS_SERVER_DOMAIN: technitium.${HOME_SUBDOMAIN}.${DOMAIN}
    volumes:
      - technitium-config:/etc/dns
    networks:
      - home-services
    ports:
      - "53:53/tcp"
      - "53:53/udp"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://localhost:5380 2>/dev/null || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  technitium-config:
    name: technitium_config
