vars:
  APPFLOWY_ADMIN_EMAIL:
    value: "admin@example.com"
    required: true
    description: "First admin account, created by GoTrue on first start — sign in at /console"
  APPFLOWY_DISABLE_SIGNUP:
    value: "true"
    required: false
    description: "Keep true and invite users from /console; set false to allow self-service signup"
  RUST_LOG:
    value: "info"
    required: false
    description: "Log level for appflowy-cloud/worker/search: error, warn, info, debug, trace"

secrets:
  APPFLOWY_ADMIN_PASSWORD:
    required: true
    description: "Password for the first admin account"
  APPFLOWY_GOTRUE_JWT_SECRET:
    required: true
    description: "Signs every auth token — changing it invalidates all sessions"

# All three on the shared instances. The postgres connection parts are
# injected separately rather than as a single dsn because GoTrue needs the same
# database with `?search_path=auth` appended — see docker-compose.yml.
#
# Extensions are pre-created by the provisioner as the postgres superuser, so
# AppFlowy's own `CREATE EXTENSION IF NOT EXISTS` calls become no-ops and its
# unprivileged role never needs to create one:
#   vector    — AppFlowy-Cloud migrations (embeddings columns)
#   uuid-ossp — AppFlowy-Cloud migrations
#   pgcrypto  — GoTrue's auth schema migrations
databases:
  - postgres:
      database: appflowy
      user: appflowy
      extensions:
        - vector
        - uuid-ossp
        - pgcrypto
      env:
        host: APPFLOWY_DB_HOST
        port: APPFLOWY_DB_PORT
        user: APPFLOWY_DB_USER
        password: APPFLOWY_DB_PASSWORD
        database: APPFLOWY_DB_NAME
  # Its own database number on homelab-redis; the dsn carries the shared
  # password and that number.
  - redis:
      env:
        dsn: APPFLOWY_REDIS_URI
  # Bucket `appflowy` and an access key for it alone on homelab-garage.
  - s3:
      bucket: appflowy
      env:
        endpoint: APPFLOWY_S3_ENDPOINT
        region: APPFLOWY_S3_REGION
        bucket: APPFLOWY_S3_BUCKET
        access_key: APPFLOWY_S3_ACCESS_KEY
        secret_key: APPFLOWY_S3_SECRET_KEY

ports:
  - 80
