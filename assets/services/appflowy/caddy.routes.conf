# Caddy routes for AppFlowy — the body of a site block, no site address.
#
# `homelab enable appflowy [--cf|--i2p|--tor|--ygg]` wraps this in whichever
# site address each layer needs, so the routes are defined once and every layer
# gets all of them. AppFlowy needs that: it splits eight path prefixes across
# five containers, and the default generated `reverse_proxy appflowy:80` would
# leave everything except "/" unreachable.
#
# This replaces upstream's nginx service — Caddy is the only reverse proxy here.
# Caddy sorts handle blocks most-specific-first, so /api/chat wins over /api.
#
# Deliberately not carried over from AppFlowy's nginx.conf:
#   - client_max_body_size / proxy_read_timeout / proxy_buffering off:
#     Caddy has no request-body limit and no proxy read timeout by default, and
#     it streams rather than buffers, so large imports and long-lived
#     websockets already work.
#   - Upgrade/Connection headers: Caddy proxies websockets natively.
#   - X-Forwarded-For / -Proto / -Host: Caddy sets these itself.

# Auth. The /gotrue prefix is stripped; the original Host is forwarded so
# GoTrue builds correct redirect_to targets.
handle_path /gotrue/* {
	reverse_proxy appflowy-gotrue:9999
}

# Presigned upload/download URLs, used directly by the browser. AppFlowy signs
# them for http://homelab-garage:3900/<bucket>/<key> and rewrites that prefix
# to https://<this host>/s3, so: strip /s3, and restore the Host the
# signature covers, or garage rejects every request. The URL's signature is
# the authorisation — garage still refuses anything unsigned or for another
# bucket's key. (Replaces the old /minio-api and /minio console routes; Garage
# has no web console.)
handle_path /s3/* {
	reverse_proxy homelab-garage:3900 {
		header_up Host homelab-garage:3900
	}
}

# Realtime collaboration websocket.
handle /ws* {
	reverse_proxy appflowy-cloud:8000
}

# AI chat streams its response — flush every write instead of buffering.
handle /api/chat* {
	reverse_proxy appflowy-cloud:8000 {
		flush_interval -1
	}
}

handle /api/* {
	reverse_proxy appflowy-cloud:8000 {
		# Workspace import uses this to build absolute links.
		header_up X-Host {scheme}://{host}
	}
}

handle /ai/* {
	reverse_proxy appflowy-cloud:8000
}

# Admin portal — user management, first login.
handle /console* {
	reverse_proxy appflowy-admin:3000
}

# Web frontend.
handle {
	reverse_proxy appflowy:80
}
