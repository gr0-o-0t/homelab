vars:
  RABBITMQ_VERSION:
    value: "4.1-management-alpine"
    required: false
    description: "rabbitmq image tag (keep a -management variant for the UI)"

secrets:
  RABBITMQ_DEFAULT_PASS:
    required: true
    generate: password
    description: "Password of the \"admin\" management user — generated by homelab, set on first start only"

ports:
  - 15672
