# Caddy routes for Immich — the body of a site block, no site address.
#
# `homelab enable immich [--cf|--i2p|--tor|--ygg]` wraps this in whichever site
# address each layer needs, so the upload-timeout route below applies on every
# layer instead of only the private one.
#
# immich-server serves both the web app and the API on port 2283 — there is no
# separate web container to route. "immich" resolves via Docker DNS on the
# home-services network.
#
# The catch-all below is what serves the web app. It stays last in the file but
# runs last regardless: Caddy sorts `route` ahead of `reverse_proxy`, so the
# upload route wins for the requests it matches and everything else — the SPA,
# its assets, the websocket at /api/socket.io — lands here.
reverse_proxy immich:2283

# Increase timeouts for large photo/video uploads.
# Adjust to your network speed.
@uploads {
	method POST PUT PATCH
	path /api/asset* /api/upload*
}
route @uploads {
	request_body {
		max_size 10GB
	}
	reverse_proxy immich:2283 {
		transport http {
			read_timeout  0
			write_timeout 0
		}
	}
}
