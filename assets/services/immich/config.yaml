vars:
  IMMICH_VERSION:
    value: "release"
    required: false
    description: "Immich image tag"

secrets: {}

# The model cache is re-downloadable, so it may live on any machine; the
# machine-learning container is the heavy one and belongs on a worker.
cache_volumes: [immich-model-cache]
placement:
  immich-machine-learning: worker

# Both on the shared instances. DB_PASSWORD is no longer a keyring secret you
# set by hand — the provisioner generates it and injects it below.
#
# superuser: Immich verifies and upgrades its vector extensions on every start,
# and its backup job shells out to pg_dumpall; neither works for a plain owner
# role. Upstream documents this as the supported way to run against an existing
# Postgres: https://docs.immich.app/administration/postgres-standalone/
#
# Extension order matters — earthdistance depends on cube, and the provisioner
# creates them in the order listed without CASCADE.
databases:
  - postgres:
      database: immich
      user: immich
      superuser: true
      extensions:
        - vector
        - vchord
        - cube
        - earthdistance
      env:
        host: DB_HOSTNAME
        port: DB_PORT
        user: DB_USERNAME
        password: DB_PASSWORD
        database: DB_DATABASE_NAME
  # Shared homelab-redis: the shared password, and a database number of its own.
  - redis:
      env:
        host: REDIS_HOSTNAME
        port: REDIS_PORT
        password: REDIS_PASSWORD
        db: REDIS_DBINDEX

ports:
  - 2283
