# ─────────────────────────────────────────────────────────────────────────────
# Service: Immich (self-hosted photo & video backup)
# https://immich.app/docs/install/docker-compose
#
# db: uses shared homelab-postgres and homelab-redis. Both connection sets are
# injected from config.yaml `databases:` at runtime.
#
# Immich no longer runs its own Postgres: the shared instance is now the
# VectorChord build (pgvector + vchord), which is exactly what Immich requires,
# so a second database container earns nothing. Upstream supports this setup —
# https://docs.immich.app/administration/postgres-standalone/
# ─────────────────────────────────────────────────────────────────────────────
# ⚠ MIGRATING AN EXISTING INSTALL
#
# The old immich-postgres container holds all your library metadata (albums,
# faces, timestamps). The photo files themselves live in immich_uploads and are
# untouched. Nothing here moves that metadata, so starting this version as-is
# hands Immich an empty database. Before `homelab up immich`:
#
#   1. homelab up postgres                     # shared instance, VectorChord
#   2. homelab setup immich                     # creates db, role, extensions
#   3. docker start immich-postgres              # the old PG14 container
#      docker exec immich-postgres \
#          pg_dump -U immich -Fc immich > immich.dump
#   4. Restore. Errors about the old pgvecto.rs `vectors` extension are
#      expected — it is gone as of Immich 3.0 and VectorChord replaces it:
#      docker exec -i homelab-postgres \
#          pg_restore -U postgres -d immich --no-owner --role=immich < immich.dump
#   5. docker exec homelab-postgres \
#          psql -U postgres -d immich -c 'REINDEX DATABASE immich;'
#   6. homelab up immich                        # rebuilds ANN indexes on start
#
# Keep the immich_pgdata volume until the library is confirmed intact.
#
# Media location: this file mounts immich_uploads at /data, which is where
# Immich has looked since 1.133 (IMMICH_MEDIA_LOCATION, default /data). An
# install that previously ran with the media at /usr/src/app/upload has that
# prefix baked into every row of the assets table, and Immich refuses to start
# with "Detected an inconsistent media location" rather than lose track of the
# files. Rewrite the stored paths once, then start normally:
#
#   docker exec -it immich immich-admin change-media-location
# ─────────────────────────────────────────────────────────────────────────────

networks:
  # Shared network — Caddy (via Tailscale namespace) reaches every service here,
  # it is how Immich reaches homelab-postgres and homelab-redis, and it is the
  # only network with egress. machine-learning needs egress: it downloads CLIP
  # and face-recognition models from HuggingFace the first time a job runs, so
  # an `internal: true` network would leave smart search permanently broken.
  home-services:
    name: home-services
    external: true

services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    # "immich" is the name Caddy uses: `reverse_proxy immich:2283`. That one
    # port serves the web app *and* the API — the separate immich-web and
    # immich-proxy containers were folded into immich-server in 1.106, and the
    # web build ships inside this image (Dockerfile: COPY --from=web … /build/www).
    container_name: immich
    # ponytail: root inside the container, unlike the rest of the catalog.
    # Immich's image declares `VOLUME /data` without creating it, so Docker
    # makes the named volume root-owned and a `user: 1000:1000` container dies
    # with EACCES on the first mount-check write. Upstream's rootless example
    # only works because it bind-mounts a host directory the admin chowned
    # first. Switch back to non-root the day this stack grows a
    # chown-the-volume step.
    restart: always
    environment:
      DB_HOSTNAME: ${DB_HOSTNAME}
      DB_PORT: ${DB_PORT}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE_NAME: ${DB_DATABASE_NAME}
      # Auto-detection already prefers VectorChord; pinning it means a
      # misconfigured shared instance fails loudly instead of quietly
      # falling back to slower plain-pgvector search.
      DB_VECTOR_EXTENSION: vectorchord
      REDIS_HOSTNAME: ${REDIS_HOSTNAME}
      REDIS_PORT: ${REDIS_PORT}
      IMMICH_VERSION: ${IMMICH_VERSION:-release}
    volumes:
      # /data, not /usr/src/app/upload — see the media-location note above.
      - immich-uploads:/data
      - /etc/localtime:/etc/localtime:ro
    networks:
      - home-services # Caddy, postgres, redis, machine-learning
    # No healthcheck block: both images ship their own (`immich-healthcheck`
    # and `python3 healthcheck.py`), which Docker uses when compose is silent.
    # The hand-written wget probe this replaced pointed at
    # /api/server-info/ping, an endpoint that has since moved.

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    # Reached by immich-server at the default http://immich-machine-learning:3003.
    container_name: immich-machine-learning
    restart: always
    volumes:
      - immich-model-cache:/cache
    networks:
      - home-services

volumes:
  immich-uploads:
    name: immich_uploads
  immich-model-cache:
    name: immich_model-cache
