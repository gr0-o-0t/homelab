# Caddy site block for Immich.
# Enabled by: make enable SERVICE=immich
# (scripts/enable-service.sh symlinks this into caddy/conf.d/immich.conf)

immich.{$HOME_SUBDOMAIN}.{$DOMAIN} {
    import wildcard_tls

    # Immich's server runs on port 2283.
    # "immich" resolves via Docker DNS on the home-services network.
    reverse_proxy immich:2283

    # Increase timeouts for large photo/video uploads.
    # Adjust to your network speed.
    @uploads {
        method POST PUT PATCH
        path /api/asset* /api/upload*
    }
    route @uploads {
        request_body {
            max_size 10GB
        }
        reverse_proxy immich:2283 {
            transport http {
                read_timeout  0
                write_timeout 0
            }
        }
    }
}
