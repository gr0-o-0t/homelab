# ─────────────────────────────────────────────────────────────────────────────
# Service: CyberChef (web app for encryption, encoding, compression and more)
# https://github.com/gchq/CyberChef
# ─────────────────────────────────────────────────────────────────────────────

networks:
  home-services:
    name: home-services
    external: true

services:
  cyberchef:
    # Official image: unprivileged nginx (uid 101) on :8080.
    image: ghcr.io/gchq/cyberchef:latest
    container_name: cyberchef
    restart: always
    networks:
      - home-services
    healthcheck:
      test:
        ["CMD-SHELL", "wget -q --spider http://localhost:8080 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
