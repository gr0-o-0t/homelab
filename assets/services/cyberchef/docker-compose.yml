# ─────────────────────────────────────────────────────────────────────────────
# Service: CyberChef (web app for encryption, encoding, compression and more)
# https://github.com/gchq/CyberChef
# ─────────────────────────────────────────────────────────────────────────────

networks:
  home-services:
    name: home-services
    external: true

services:
  cyberchef:
    image: mpepping/cyberchef:latest
    container_name: cyberchef
    user: "${PUID:-1000}:${PGID:-1000}"
    restart: unless-stopped
    networks:
      - home-services
    healthcheck:
      test:
        ["CMD-SHELL", "wget -q --spider http://localhost 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
