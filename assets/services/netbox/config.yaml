vars:
  NETBOX_VERSION:
    value: "latest"
    required: false
    description: "NetBox image tag. Pin a version before upgrading - NetBox migrations are one-way, so never pin below the running version"
  PUID:
    value: "1000"
    required: false
  PGID:
    value: "1000"
    required: false
  TZ:
    value: "UTC"
    required: false
  SUPERUSER_EMAIL:
    value: ""
    required: false

secrets:
  SECRET_KEY:
    required: true
    description: "Django secret key - signs sessions and tokens; changing it logs everyone out"
  SUPERUSER_PASSWORD:
    required: true
    description: "Password for the initial superuser account"

databases:
  - postgres:
      database: netbox
      user: netbox
      env:
        host: NB_DB_HOST
        port: NB_DB_PORT
        user: NB_DB_USER
        password: NB_DB_PASS
        database: NB_DB_NAME
  # Shared homelab-redis. NetBox keeps its task queue and its cache in two
  # separate databases, so it declares two named instances and gets two
  # numbers; the host and shared password are the same for both.
  - redis:
      name: tasks
      env:
        host: NB_REDIS_HOST
        port: NB_REDIS_PORT
        password: NB_REDIS_PASSWORD
        db: NB_REDIS_DB_TASK
  - redis:
      name: cache
      env:
        db: NB_REDIS_DB_CACHE
ports:
  - 8000
