# ─────────────────────────────────────────────────────────────────────────────
# Service: NetBox (network source of truth & IPAM/DCIM)
# https://docs.linuxserver.io/images/docker-netbox/
# ─────────────────────────────────────────────────────────────────────────────
# Database: uses shared PostgreSQL (homelab-postgres). Redis/valkey remains
# local (two instances needed for main+cache separation).
# ─────────────────────────────────────────────────────────────────────────────

networks:
  home-services:
    name: home-services
    external: true

services:
  netbox:
    image: lscr.io/linuxserver/netbox:latest
    container_name: netbox
    user: "${PUID:-1000}:${PGID:-1000}"
    restart: unless-stopped
    depends_on:
      netbox-redis:
        condition: service_healthy
      netbox-redis-cache:
        condition: service_healthy
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
      SUPERUSER_EMAIL: ${SUPERUSER_EMAIL}
      SUPERUSER_PASSWORD: ${SUPERUSER_PASSWORD}
      ALLOWED_HOST: "netbox.${HOME_SUBDOMAIN}.${DOMAIN}"
      DB_HOST: ${NB_DB_HOST}
      DB_PORT: ${NB_DB_PORT}
      DB_NAME: ${NB_DB_NAME}
      DB_USER: ${NB_DB_USER}
      DB_PASSWORD: ${NB_DB_PASS}
      REDIS_HOST: netbox-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_CACHE_HOST: netbox-redis-cache
      REDIS_CACHE_PORT: 6380
      REDIS_CACHE_PASSWORD: ""
      SECRET_KEY: ${SECRET_KEY}
    volumes:
      - netbox-data:/config
    networks:
      - home-services
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://localhost:8080 2>/dev/null || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  netbox-redis:
    image: docker.io/valkey/valkey:9-alpine
    container_name: netbox-redis
    user: "${PUID:-1000}:${PGID:-1000}"
    restart: unless-stopped
    command: valkey-server --port 6379
    networks:
      - home-services
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -p 6379 ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  netbox-redis-cache:
    image: docker.io/valkey/valkey:9-alpine
    container_name: netbox-redis-cache
    user: "${PUID:-1000}:${PGID:-1000}"
    restart: unless-stopped
    command: valkey-server --port 6380
    networks:
      - home-services
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -p 6380 ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  netbox-data:
    name: netbox_data
