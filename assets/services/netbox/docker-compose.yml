# ─────────────────────────────────────────────────────────────────────────────
# Service: NetBox (network source of truth & IPAM/DCIM)
# https://docs.linuxserver.io/images/docker-netbox/
# ─────────────────────────────────────────────────────────────────────────────
# Database: uses shared PostgreSQL (homelab-postgres) via config.yaml
# `databases:` section — NB_DB_HOST/NB_DB_PORT/NB_DB_NAME/etc.
#
# Redis: shared homelab-redis, two database numbers (task queue, cache)
# from the two named `redis` declarations in config.yaml. The LinuxServer
# image reads REDIS_HOST/PORT/PASSWORD plus REDIS_DB_TASK and REDIS_DB_CACHE
# (init-netbox-config) — one host, two databases.
#
# ⚠ That init script only renders /config/configuration.py when the file does
# not exist yet. An install from before this change keeps pointing at the
# removed netbox-redis containers: edit the REDIS block in
# /config/configuration.py (netbox_data volume) to match these values, or
# move the file aside so the next start regenerates it.
# ─────────────────────────────────────────────────────────────────────────────

networks:
  home-services:
    name: home-services
    external: true

services:
  netbox:
    image: lscr.io/linuxserver/netbox:${NETBOX_VERSION:-latest}
    container_name: netbox
    # No `user:` — LinuxServer images boot s6-overlay as root and drop to
    # PUID/PGID (below) themselves; a forced uid breaks /init.
    restart: always
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
      SUPERUSER_EMAIL: ${SUPERUSER_EMAIL}
      SUPERUSER_PASSWORD: ${SUPERUSER_PASSWORD}
      ALLOWED_HOST: "netbox.${HOME_SUBDOMAIN}.${DOMAIN}"
      DB_HOST: ${NB_DB_HOST}
      DB_PORT: ${NB_DB_PORT}
      DB_NAME: ${NB_DB_NAME}
      DB_USER: ${NB_DB_USER}
      DB_PASSWORD: ${NB_DB_PASS}
      REDIS_HOST: ${NB_REDIS_HOST}
      REDIS_PORT: ${NB_REDIS_PORT}
      REDIS_PASSWORD: ${NB_REDIS_PASSWORD}
      REDIS_DB_TASK: ${NB_REDIS_DB_TASK}
      REDIS_DB_CACHE: ${NB_REDIS_DB_CACHE}
      SECRET_KEY: ${SECRET_KEY}
    volumes:
      - netbox-data:/config
    networks:
      - home-services
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://localhost:8000 2>/dev/null || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

volumes:
  netbox-data:
    name: netbox_data
