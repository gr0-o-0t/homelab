# ─────────────────────────────────────────────────────────────────────────────
# Service: Gitea (self-hosted Git service)
# https://docs.gitea.com
# ─────────────────────────────────────────────────────────────────────────────
# Database: uses shared PostgreSQL (homelab-postgres). DB credentials are
# auto-generated at `homelab service setup gitea` and injected at runtime.
# ─────────────────────────────────────────────────────────────────────────────

networks:
  home-services:
    name: home-services
    external: true

services:
  gitea:
    image: gitea/gitea:latest
    container_name: gitea
    user: "${PUID:-1000}:${PGID:-1000}"
    restart: unless-stopped
    environment:
      USER_UID: ${PUID:-1000}
      USER_GID: ${PGID:-1000}
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: ${GI_DB_HOST}:${GI_DB_PORT}
      GITEA__database__NAME: ${GI_DB_NAME}
      GITEA__database__USER: ${GI_DB_USER}
      GITEA__database__PASSWD: ${GI_DB_PASS}
      GITEA__server__DOMAIN: gitea.${HOME_SUBDOMAIN}.${DOMAIN}
      GITEA__server__ROOT_URL: https://gitea.${HOME_SUBDOMAIN}.${DOMAIN}
      GITEA__server__SSH_DOMAIN: gitea.${HOME_SUBDOMAIN}.${DOMAIN}
    volumes:
      - gitea-data:/data
      - gitea-config:/etc/gitea
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - home-services
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://localhost:3000 2>/dev/null || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  gitea-data:
    name: gitea_data
  gitea-config:
    name: gitea_config
