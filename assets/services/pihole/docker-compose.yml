# ─────────────────────────────────────────────────────────────────────────────
# Service: Pi-hole (network-wide ad blocking DNS server)
# https://github.com/pi-hole/docker-pi-hole
# ─────────────────────────────────────────────────────────────────────────────
# NOTE: DNS (53) and DHCP (67/udp) are published on DNS_BIND_IP / DHCP_BIND_IP,
# loopback by default — Docker's iptables rules bypass ufw, so 0.0.0.0 would
# expose the resolver off-tailnet. Set them in config.yaml.

networks:
  home-services:
    name: home-services
    external: true

services:
  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    # No `user:` — start.sh must run as root (it fixes ownership and caps,
    # then FTL drops to the image's pihole user).
    restart: always
    environment:
      TZ: ${TZ:-UTC}
      # Pi-hole v6 names (WEBPASSWORD / VIRTUAL_HOST were v5 and are ignored).
      FTLCONF_webserver_api_password: ${WEB_PASSWORD}
      # Queries arrive via a Docker port publish, so they are not from a
      # "local" subnet; the default LOCAL mode would refuse them.
      FTLCONF_dns_listeningMode: "all"
    volumes:
      - pihole-data:/etc/pihole
      - pihole-dnsmasq:/etc/dnsmasq.d
    networks:
      - home-services
    ports:
      - "${DNS_BIND_IP:-127.0.0.1}:53:53/tcp"
      - "${DNS_BIND_IP:-127.0.0.1}:53:53/udp"
      - "${DHCP_BIND_IP:-127.0.0.1}:67:67/udp"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://localhost/admin 2>/dev/null || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  pihole-data:
    name: pihole_data
  pihole-dnsmasq:
    name: pihole_dnsmasq
