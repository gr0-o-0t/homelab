# ─────────────────────────────────────────────────────────────────────────────
# Service: Pocket ID (OIDC identity provider)
# https://github.com/pocket-id/pocket-id
# ─────────────────────────────────────────────────────────────────────────────

networks:
  home-services:
    name: home-services
    external: true

services:
  pocket-id:
    image: ghcr.io/pocket-id/pocket-id:latest
    container_name: pocket-id
    restart: always
    # No `user:`: /app/data does not exist in the image, so the named volume
    # starts root-owned. The entrypoint chowns it and drops to PUID/PGID.
    environment:
      # PUBLIC_APP_URL was renamed APP_URL in v1; the old name is ignored.
      APP_URL: "https://pocket-id.${HOME_SUBDOMAIN}.${DOMAIN}"
      TRUST_PROXY: "true"
      # Required by current releases (upstream .env.example): encrypts data at rest.
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    volumes:
      - pocket-id-data:/app/data
    networks:
      - home-services
    healthcheck:
      test: ["CMD", "/app/pocket-id", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  pocket-id-data:
    name: pocket-id_data
