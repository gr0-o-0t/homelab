vars:
  GARAGE_VERSION:
    value: "v2.4.1"
    required: false
    description: "dxflrs/garage image tag"

secrets:
  GARAGE_RPC_SECRET:
    required: true
    generate: hex32
    description: "Cluster RPC secret (32 bytes hex) — generated by homelab"
  GARAGE_ADMIN_TOKEN:
    required: true
    generate: password
    description: "Admin API bearer token — generated by homelab"
