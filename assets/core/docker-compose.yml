# ─────────────────────────────────────────────────────────────────────────────
# Core stack: Tailscale + Caddy [+ cloudflared] [+ tor] [+ i2p] [+ yggdrasil] [+ ipfs]
#
# Architecture
# ────────────
#   tailscale    → joins your tailnet; also attached to the shared
#                  `home-services` Docker network so its network namespace
#                  can reach every service container by name.
#
#   caddy        → uses `network_mode: service:tailscale` which shares
#                  Tailscale's full network namespace (tunnel + Docker networks).
#                  From Caddy's perspective it IS the Tailscale node, so:
#                    • It listens on the Tailscale IP (100.x.x.x)
#                    • It can resolve service container names on home-services
#
#   cloudflared  → optional; profile "tunnel". Connects outbound-only to
#                  Cloudflare's edge and forwards public traffic to Caddy
#                  via http://tailscale:80 (shared netns trick — Caddy is
#                  reachable on the tailscale container's Docker IP).
#                  Start with: homelab core start  (auto-activated when
#                  CF_TUNNEL_TOKEN secret is configured with setup).
#
#   tor          → optional; profile "tor". Exposes services as .onion
#                  addresses. Activate with: homelab ext enable tor
#
#   i2p          → optional; profile "i2p". I2P router + eepsite hosting
#                  via i2pd (C++). Activate with: homelab ext enable i2p
#
#   yggdrasil    → optional; profile "yggdrasil". IPv6 mesh node with
#                  socat port-forwarders for per-service exposure.
#                  Auto-activated when YGGDRASIL_ENABLED=true.
#
#   ipfs         → optional; profile "ipfs". IPFS Kubo node for
#                  content-addressed P2P storage. Gateway fronted by Caddy.
#                  Auto-activated when IPFS_ENABLED=true.
#
# External network `home-services` must be created before starting this stack:
#   docker network create home-services
# (or run `homelab setup` which does this automatically)
# ─────────────────────────────────────────────────────────────────────────────

networks:
  home-services:
    name: home-services
    external: true # shared with all service stacks

services:
  # ── Tailscale ──────────────────────────────────────────────────────────────
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    hostname: ${TS_HOSTNAME:-caddy-home}
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_STATE_DIR: /var/lib/tailscale
      # Userspace networking OFF → Tailscale uses a real kernel TUN device,
      # which is required for the shared network_mode trick to work correctly.
      TS_USERSPACE: false
      TS_ACCEPT_DNS: true
      # Enable healthcheck endpoint: "/healthz"
      TS_ENABLE_HEALTH_CHECK: true
      TS_LOCAL_ADDR_PORT: 127.0.0.1:41234
      # Serve only; do not act as exit node or subnet router by default.
      # Add --advertise-tags=tag:homelab if you use ACL tags in your tailnet.
      TS_EXTRA_ARGS: ""
    volumes:
      - tailscale-state:/var/lib/tailscale
      # TUN device — must exist on the host (standard on Linux; see README
      # for macOS / WSL2 notes)
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    networks:
      - home-services # gives Caddy reachability to service containers
    healthcheck:
      # Passes once Tailscale has received its 100.x.x.x address, meaning it
      # is authenticated and connected to the tailnet.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:41234/healthz"] # Check Tailscale has a Tailnet IP and is operational
      interval: 1m # How often to perform the check
      timeout: 10s # Time to wait for the check to succeed
      retries: 3 # Number of retries before marking as unhealthy
      start_period: 10s # Time to wait before starting health checks

  # ── Caddy ──────────────────────────────────────────────────────────────────
  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    container_name: caddy
    # KEY DESIGN: share Tailscale's network namespace.
    # Caddy inherits every network interface Tailscale has, including:
    #   • The tailscale0 TUN (100.x.x.x)
    #   • The home-services Docker bridge
    # This means we do NOT add caddy to any explicit `networks:` block here.
    network_mode: "service:tailscale"
    restart: unless-stopped
    depends_on:
      tailscale:
        condition: service_healthy # wait for Tailscale IP before binding
    environment:
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
      DOMAIN: ${DOMAIN}
      HOME_SUBDOMAIN: ${HOME_SUBDOMAIN:-home}
      ACME_EMAIL: ${ACME_EMAIL}
    healthcheck:
      test: ["CMD", "pgrep", "-f", "caddy"] # Check if ${SERVICE} process is running
      interval: 1m # How often to perform the check
      timeout: 10s # Time to wait for the check to succeed
      retries: 3 # Number of retries before marking as unhealthy
      start_period: 30s # Time to wait before starting health checks

    volumes:
      # Main Caddyfile
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # conf.d, conf.d-cf, and services are mounted under a shared /homelab/
      # prefix so that relative symlinks (../../services/…) from conf.d/ resolve
      # to /homelab/services/… in the container — matching the host repo layout.
      - ../caddy/conf.d:/homelab/caddy/conf.d:ro
      - ../caddy/conf.d-cf:/homelab/caddy/conf.d-cf:ro
      - ../services:/homelab/services:ro
      # Persistent ACME certs and Caddy state — never delete this volume!
      - caddy-data:/data
      - caddy-config:/config

  # ── Cloudflare Tunnel (optional) ───────────────────────────────────────────
  # Activated automatically by `homelab core start` when CF_TUNNEL_TOKEN is
  # set. Forwards *.{PUB_SUBDOMAIN}.{DOMAIN} public traffic to Caddy.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN}
    networks:
      - home-services
    depends_on:
      tailscale:
        condition: service_healthy # don't route public traffic until tailnet is up
    # Note: no healthcheck — cloudflared's image has no curl/wget, and no other
    # service depends on cloudflared being healthy.

  # ── Tor onion service proxy (optional) ──────────────────────────────
  # Profile-activated. Enable with: homelab ext enable tor
  # Each service gets a HiddenServicePort .onion address.
  # Reload config via: docker exec tor sh -c 'kill -HUP $(pidof tor)'
  tor:
    image: gnzsnz/torproxy:latest
    container_name: tor
    profiles: ["tor"]
    restart: unless-stopped
    volumes:
      - ../tor/torrc:/etc/tor/torrc:ro
      - ../tor/torrc.d:/etc/tor/torrc.d:ro
      - tor-data:/var/lib/tor/hidden_service
    networks:
      - home-services
    depends_on:
      tailscale:
        condition: service_healthy

  # ── I2P router + eepsite proxy (optional) ───────────────────────────
  # Profile-activated. Enable with: homelab ext enable i2p
  # Uses i2pd (C++ implementation) — lighter than Java I2P.
  # Eepsite tunnels configured via tunnels.conf.
  # Manage tunnels: homelab i2p enable <service>
  # Web Console: http://i2p:7070
  i2p:
    build:
      context: .
      dockerfile: Dockerfile.i2p
    container_name: i2p
    profiles: ["i2p"]
    restart: unless-stopped
    volumes:
      - ../i2p:/config-host:ro
      - i2p-config:/home/i2pd/data
    networks:
      - home-services
    ports:
      - "${I2P_EXT_PORT:-45678}:45678"
      - "${I2P_EXT_PORT:-45678}:45678/udp"
    depends_on:
      tailscale:
        condition: service_healthy

  # ── Yggdrasil IPv6 mesh node (optional) ────────────────────────────
  # Activated when YGGDRASIL_ENABLED=true.
  # Custom image (Dockerfile.ygg) bundles yggdrasil + socat.
  # Each service gets a socat TCP6→TCP4 forwarder for exposure.
  yggdrasil:
    build:
      context: .
      dockerfile: Dockerfile.ygg
    container_name: yggdrasil
    profiles: ["yggdrasil"]
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    volumes:
      - ../yggdrasil/yggdrasil.conf:/etc/yggdrasil.conf:ro
      - ../yggdrasil/socat.d:/etc/socat.d:ro
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
    networks:
      - home-services
    depends_on:
      tailscale:
        condition: service_healthy

  # ── IPFS Kubo node (optional) ──────────────────────────────────────
  # Activated when IPFS_ENABLED=true.
  # Content-addressed P2P storage. Gateway HTTP port exposed to
  # home-services for Caddy reverse proxy.
  ipfs:
    image: ipfs/kubo:latest
    container_name: ipfs
    profiles: ["ipfs"]
    restart: unless-stopped
    environment:
      IPFS_PROFILE: ${IPFS_PROFILE:-server}
    volumes:
      - ipfs-data:/data/ipfs
      - ipfs-staging:/export
    networks:
      - home-services
    depends_on:
      tailscale:
        condition: service_healthy

volumes:
  tailscale-state:
    name: core_tailscale-state
  caddy-data:
    name: core_caddy-data
  caddy-config:
    name: core_caddy-config
  tor-data:
    name: core_tor-data
  i2p-config:
    name: core_i2p-config
  ipfs-data:
    name: core_ipfs-data
  ipfs-staging:
    name: core_ipfs-staging
