## i2pd tunnel configuration
## Server tunnels (eepsites) are added/removed by:
##   homelab i2p enable <service>
##   homelab i2p disable <service>
## i2pd reads this file in place. After editing it, reload the tunnels
## without restarting the router:
##   docker kill -s HUP i2p
## https://i2pd.readthedocs.io/en/latest/user-guide/tunnels/
