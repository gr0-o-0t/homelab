version: "2"

run:
  # CI lints twice (default + nogui) and starts with an empty cache on a new
  # cache key; 5m was not enough there.
  timeout: 15m
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - errcheck
    - staticcheck
    - govet
    - ineffassign
    - errorlint
    - gosec
    - goconst
    - intrange
    - gocritic
  settings:
    errcheck:
      check-type-assertions: false
      check-blank: false
    staticcheck:
      checks:
        - "all"
        - "-ST1000"
    gosec:
      excludes:
        - G115
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
      disabled-checks:
        - ifElseChain
        - hugeParam
        - rangeValCopy
    goconst:
      min-len: 3
      min-occurrences: 10
      # Command words that recur as icon names, argv and docker subcommands
      # by coincidence; one shared constant would couple unrelated packages.
      ignore-string-values:
        - "^(agent|exec|upgrade)$"
  exclusions:
    rules:
      - path: '(.+)_test\.go'
        linters:
          - goconst
          - gocritic
      - path: internal/run/commander.go
        text: G204
      - path: cmd/doctor.go
        text: G204
      - path: cmd/health.go
        text: G204
      - path: cmd/helpers.go
        text: G304
      - path: internal/configgen/configgen.go
        text: G306|QF1012
      - path: internal/tui/logs/model.go
        text: G204
      - path: internal/config/config.go
        text: G304
      - path: internal/network/i2p/layer.go
        text: G304|G703
      - path: internal/network/tor/layer.go
        text: G301
      - path: _test\.go
        linters:
          - gosec

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
